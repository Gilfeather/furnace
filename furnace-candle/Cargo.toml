[package]
name = "furnace-candle"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
authors = ["Furnace Contributors"]
description = "GGUF LLMs (llama and qwen2 families) on the CPU through candle, served by furnace"
repository = "https://github.com/Gilfeather/furnace"
license = "MIT"
# Not published until a candle release on crates.io drops the Oniguruma (C) dependency that
# candle-core 0.11.0 has. Until then candle comes from git: main (which uses fancy-regex) at
# 12bb5d1, plus huggingface/candle#4041 (zip 9, for RUSTSEC-2026-0367, -0368 and -0369), from
# its author's fork until it is merged
publish = false

[dependencies]
furnace = { package = "furnace-server", path = "..", version = "0.16.1", default-features = false, features = ["llm"] }
# candle at a fixed revision, CPU only: no cuda, cudnn, mkl, accelerate or metal
candle-core = { git = "https://github.com/Goldziher/candle", rev = "70f72e9cfdbfc570846ca363ead2135394af3e9a" }
candle-nn = { git = "https://github.com/Goldziher/candle", rev = "70f72e9cfdbfc570846ca363ead2135394af3e9a" }
tracing = "0.1"

[dev-dependencies]
# candle's own quantized models, as the reference the tests compare against
candle-transformers = { git = "https://github.com/Goldziher/candle", rev = "70f72e9cfdbfc570846ca363ead2135394af3e9a" }
tokio = { version = "1.53", features = ["full"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
axum = "0.8"
