apiVersion: v1
kind: Service
metadata:
  name: {{ include "furnace.fullname" . }}
  labels:
    {{- include "furnace.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "furnace.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.http.port }}
      targetPort: http
      appProtocol: {{ if .Values.tls.existingSecret }}https{{ else }}http{{ end }}
    {{- if .Values.grpc.enabled }}
    - name: grpc
      port: {{ .Values.grpc.port }}
      targetPort: grpc
      appProtocol: grpc
    {{- end }}
