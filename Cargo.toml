[package]
name = "furnace"
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
authors = ["Furnace Contributors"]
description = "🔥 High-performance Rust ML inference server powered by Burn framework"
documentation = "https://docs.rs/furnace"
homepage = "https://github.com/Gilfeather/furnace"
repository = "https://github.com/Gilfeather/furnace"
license = "MIT"
keywords = ["machine-learning", "inference", "server", "rust", "burn"]
categories = ["web-programming::http-server", "science"]
readme = "README.md"
exclude = [
    ".github/",
    "docs/",
    "*.md",
    ".gitignore",
    ".dockerignore",
    "Dockerfile",
    "deny.toml",
]

[[bin]]
name = "furnace"
path = "src/main.rs"



[features]
default = ["onnx"]
# Generate built-in models from ONNX files in models/ at build time
onnx = ["dep:burn-onnx", "dep:onnx-ir"]
# Compile built-in model weights into the binary (single-file deploys).
# Default: weights stay in a separate <name>.bpk file loaded at startup.
embed-weights = ["onnx"]
wgpu = ["burn/wgpu"]
metal = ["burn/metal"]
cuda = ["burn/cuda"]

[dependencies]
# ML Framework
# `rayon` and `simd` are burn-flex defaults that `default-features = false` would drop:
# without them the CPU backend runs single-threaded on scalar kernels
burn = { version = "0.22", default-features = false, features = ["std", "flex", "store", "rayon", "simd"] }
burn-store = { version = "0.22", features = ["std"] }
# Zero-copy weight loading: .bpk files are memory-mapped and shared with tensors
bytes = "1.9"
memmap2 = "0.9"

# Web Framework
axum = "0.8"
tower = { version = "0.5", features = ["limit"] }
tower-http = { version = "0.7", features = ["cors", "limit", "set-header"] }
tokio = { version = "1.53", features = ["full"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "chrono"] }
uuid = { version = "1.0", features = ["v4"] }

# Error Handling
thiserror = "2.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }

[build-dependencies]
burn-onnx = { version = "0.22", optional = true }
# Reads model input/output shapes for the built-in model registry (already a burn-onnx dependency)
onnx-ir = { version = "0.22", optional = true }

[dev-dependencies]
tempfile = "3.12"
reqwest = { version = "0.13", features = ["json"] }
tower = { version = "0.5", features = ["util"] }
criterion = { version = "0.8", features = ["html_reports"] }
rand = "0.10"

[[bench]]
name = "inference_benchmark"
harness = false

[profile.release]
# Maximum performance optimizations
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
overflow-checks = false

[profile.release.build-override]
opt-level = 3
codegen-units = 1

[profile.dev]
# Faster compilation for development
opt-level = 0
debug = true
split-debuginfo = "unpacked"

[profile.test]
# Better debugging for tests
opt-level = 0
debug = true

[profile.bench]
# Optimize for benchmarks
opt-level = 3
debug = false
lto = true

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"