[package]
# Published as `furnace-server` (the `furnace` crate name belongs to another project); the
# library and the binary are both still called `furnace`.
name = "furnace-server"
version = "0.10.0"
edition = "2024"
rust-version = "1.95"
authors = ["Furnace Contributors"]
description = "Fast, unified, Rust-native, Axum-compatible inference endpoints for Burn models and LLMs: KServe / Triton and OpenAI APIs from one pure-Rust server"
documentation = "https://docs.rs/furnace-server"
homepage = "https://github.com/Gilfeather/furnace"
repository = "https://github.com/Gilfeather/furnace"
license = "MIT"
keywords = ["machine-learning", "inference", "onnx", "server", "burn"]
categories = ["web-programming::http-server", "science"]
readme = "README.md"
exclude = [
    ".github/",
    ".kiro/",
    "docs/",
    "/benches/compare/",
    "/models/",
    # crates.io builds use upstream burn-flex; [patch.crates-io] only applies in this repo
    "/vendor/",
    "/sample_model.*",
    ".gitignore",
    "/Dockerfile",
    ".dockerignore",
    "deny.toml",
    "default.nix",
    "flake.nix",
    # The candle adapter is its own crate (not published yet)
    "/furnace-candle/",
]

# `cargo binstall furnace-server` downloads the release binary instead of compiling
[package.metadata.binstall]
pkg-fmt = "bin"
bin-dir = "furnace{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/furnace-linux-x86_64"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/furnace-linux-x86_64-musl"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/furnace-linux-aarch64"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/furnace-macos-x86_64"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/furnace-macos-aarch64"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/furnace-windows-x86_64.exe"

[package.metadata.docs.rs]
# Document the gRPC, TLS and image input APIs too
features = ["grpc", "tls", "image", "llm", "nerve"]

[workspace]
members = [".", "furnace-candle"]
# Benchmarks with their own workspaces, lockfiles and targets
exclude = ["benches/burn", "benches/compare"]

[lib]
name = "furnace"
path = "src/lib.rs"

[[bin]]
name = "furnace"
path = "src/main.rs"



[features]
default = ["onnx"]
# Generate built-in models from ONNX files in models/ at build time
onnx = ["dep:burn-onnx", "dep:onnx-ir"]
# Compile built-in model weights into the binary (single-file deploys).
# Default: weights stay in a separate <name>.bpk file loaded at startup.
embed-weights = ["onnx"]
# Accept `image/jpeg` and `image/png` on POST /predict, with ImageNet preprocessing done by
# the server. Off by default to keep the binary small.
image = ["dep:image"]
# The Open Inference Protocol over gRPC (`--grpc-port`), next to the HTTP API
grpc = ["dep:tonic", "dep:tonic-prost", "dep:prost", "dep:tonic-prost-build", "dep:protox"]
# TLS for HTTP and gRPC (`--tls-cert`, `--tls-key`, `--tls-client-ca`): rustls with a pure-Rust
# crypto provider built on RustCrypto (src/tls/provider.rs)
tls = ["dep:rustls", "dep:tokio-rustls", "dep:tokio-stream", "dep:aes-gcm", "dep:chacha20poly1305", "dep:p256", "dep:p384", "dep:ed25519-dalek", "dep:x25519-dalek", "dep:sha2", "dep:hmac", "dep:getrandom"]
# Serve LLMs: OpenAI-compatible chat and completions with streaming, behind the `LlmEngine` and
# `StepModel` traits (src/llm). Engines come from other crates, such as furnace-candle.
llm = ["dep:tokenizers", "dep:minijinja", "dep:minijinja-contrib"]
# The nervous system (src/nerve) is always built: the server's own routes run on it. The
# feature is kept so that existing `--features nerve` builds still work.
nerve = []
wgpu = ["burn/wgpu"]
metal = ["burn/metal"]
cuda = ["burn/cuda"]

[dependencies]
# ML Framework
# `rayon` and `simd` are burn-flex defaults that `default-features = false` would drop:
# without them the CPU backend runs single-threaded on scalar kernels
burn = { version = "0.22", default-features = false, features = ["std", "flex", "store", "rayon", "simd"] }
burn-store = { version = "0.22", default-features = false, features = ["std", "memmap"] }
# Zero-copy weight loading: .bpk files are memory-mapped and shared with tensors
bytes = "1.9"
memmap2 = "0.9"

# Web Framework
axum = "0.8"
tower = { version = "0.5", features = ["limit"] }
tokio = { version = "1.53", features = ["full"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "chrono"] }
uuid = { version = "1.0", features = ["v4"] }

# Image input (`image` feature)
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }

# Error Handling
thiserror = "2.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
toml = "1"
num_cpus = "1"
# Parses the numbers of JSON request bodies straight to f32 (see src/json_fast.rs)
fast-float2 = "0.2"
# gRPC transport for the Open Inference Protocol (feature `grpc`)
prost = { version = "0.14", optional = true }
tonic = { version = "0.14", optional = true }
tonic-prost = { version = "0.14", optional = true }
rayon = "1"
# TLS (feature `tls`): rustls without its C-based providers, and RustCrypto primitives
rustls = { version = "0.23.46", default-features = false, features = ["std", "logging"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging"], optional = true }
tokio-stream = { version = "0.1", optional = true }
aes-gcm = { version = "0.11", optional = true }
chacha20poly1305 = { version = "0.11", optional = true }
p256 = { version = "0.14", features = ["ecdh", "ecdsa", "pkcs8"], optional = true }
p384 = { version = "0.14", features = ["ecdh", "ecdsa", "pkcs8"], optional = true }
ed25519-dalek = { version = "3", features = ["pkcs8"], optional = true }
x25519-dalek = { version = "3", features = ["static_secrets"], optional = true }
sha2 = { version = "0.11", optional = true }
hmac = { version = "0.13", optional = true }
getrandom = { version = "0.4", optional = true }
# LLM serving (feature `llm`). tokenizers without its defaults: they build Oniguruma (C) and
# esaxx (C++); fancy-regex is the pure-Rust regex engine. minijinja without `stacker` (cc).
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"], optional = true }
minijinja = { version = "2.24", default-features = false, features = ["builtins", "json", "serde", "macros", "loop_controls", "multi_template"], optional = true }
minijinja-contrib = { version = "2.24", default-features = false, features = ["pycompat"], optional = true }
futures-util = { version = "0.3", default-features = false }

[build-dependencies]
burn-onnx = { version = "0.22", optional = true }
# gRPC: a pure-Rust protobuf compiler, so building needs no `protoc`
protox = { version = "0.10", optional = true }
tonic-prost-build = { version = "0.14", optional = true }
# Reads model input/output shapes for the built-in model registry (already a burn-onnx dependency)
onnx-ir = { version = "0.22", optional = true }

[dev-dependencies]
tempfile = "3.12"
reqwest = { version = "0.13", features = ["json"] }
tower = { version = "0.5", features = ["util"] }
# Serves the gRPC tests on an ephemeral port
tokio-stream = { version = "0.1", features = ["net"] }
criterion = { version = "0.8", features = ["html_reports"] }
# Connects the gRPC-over-TLS test's client through the test's own TLS stream
hyper-util = { version = "0.1", features = ["tokio"] }
rand = "0.10"
# Builds ONNX graphs for the build/optimize.rs tests (already a build dependency)
onnx-ir = "0.22"

[[test]]
name = "llm"
required-features = ["llm"]


[[example]]
name = "nerve"
path = "examples/nerve/main.rs"
required-features = ["llm"]

[[bench]]
name = "inference_benchmark"
harness = false

[profile.release]
# Maximum performance optimizations
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
overflow-checks = false

# CI test builds: release optimizations (ResNet-18 stays fast in tests) without the whole-program
# LTO and single codegen unit, which make every test binary take minutes to link
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16

# Build scripts (burn-onnx's model code generation) stay optimized, without the single
# codegen unit that serializes their compilation
[profile.ci.build-override]
opt-level = 3
codegen-units = 16

[profile.release.build-override]
opt-level = 3
codegen-units = 1

[profile.dev]
# Light optimization: still quick to rebuild, and fast enough for the tests that need concurrent
# requests to overlap (request parsing at opt-level 0 serializes them)
opt-level = 1
debug = true
split-debuginfo = "unpacked"

# Dependencies (Burn's CPU kernels above all) are optimized even in debug builds, so `cargo test`
# runs ResNet-18 at a usable speed while furnace's own code still rebuilds quickly
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.test]
opt-level = 1
debug = true

[profile.bench]
# Optimize for benchmarks
opt-level = 3
debug = false
lto = true

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Faster 2D convolutions on the CPU backend, pending upstream review in tracel-ai/burn.
# vendor/burn-flex is burn-flex 0.22.0 plus that patch; see vendor/README.md.
[patch.crates-io]
burn-flex = { path = "vendor/burn-flex" }
