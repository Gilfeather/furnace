[package]
# Published as `furnace-server` (the `furnace` crate name belongs to another project); the
# library is still called `furnace`. Burn models are served through furnace-burn, the `furnace`
# command is furnace-cli.
name = "furnace-server"
version = "0.15.0"
edition = "2024"
rust-version = "1.95"
authors = ["Furnace Contributors"]
description = "Fast, unified, Rust-native, Axum-compatible inference endpoints and nervous system for tensor models and LLMs: KServe / Triton and OpenAI APIs from one pure-Rust server"
documentation = "https://docs.rs/furnace-server"
repository = "https://github.com/Gilfeather/furnace"
license = "MIT"
keywords = ["machine-learning", "inference", "server", "llm", "axum"]
categories = ["web-programming::http-server", "science"]
readme = "README.md"
exclude = [
    ".github/",
    ".kiro/",
    "docs/",
    # The harnesses (their own workspaces and lockfiles) and the CI summary script;
    # benches/inference_benchmark.rs stays
    "/benches/*/",
    "/benches/ci-summary.sh",
    "/models/",
    "/sample_model.*",
    ".gitignore",
    "/Dockerfile",
    ".dockerignore",
    "deny.toml",
    "default.nix",
    "flake.nix",
    # The other crates of the workspace are published on their own (or not yet)
    "/furnace-burn/",
    "/furnace-cli/",
    "/furnace-candle/",
    "/amate/",
    "/kuebiko/",
    "/kamui/",
    "/rustls-pure/",
    "/furnace-demo/",
]

[package.metadata.docs.rs]
# Document the gRPC, TLS and image input APIs too
features = ["grpc", "tls", "image", "llm"]

[workspace]
members = [".", "amate", "kuebiko", "kamui", "rustls-pure", "furnace-burn", "furnace-cli", "furnace-candle", "furnace-demo"]
# `cargo build`, `cargo test` and `cargo clippy` at the root cover the server and its parts, the
# Burn adapter and the `furnace` command; furnace-candle (candle from git) only with
# `-p furnace-candle`; furnace-demo (the LLM feature on) only with `-p furnace-demo`
default-members = [".", "amate", "kuebiko", "kamui", "rustls-pure", "furnace-burn", "furnace-cli"]
# Benchmarks with their own workspaces, lockfiles and targets, and the helpers they share
exclude = ["benches/burn", "benches/common", "benches/compare", "benches/llm", "benches/nerve"]

[lib]
name = "furnace"
path = "src/lib.rs"

[features]
default = []
# Accept `image/jpeg` and `image/png` on POST /predict, with ImageNet preprocessing done by
# the server. Off by default to keep the binary small.
image = ["dep:image"]
# The Open Inference Protocol over gRPC (`--grpc-port`), next to the HTTP API
grpc = ["dep:tonic", "dep:tonic-prost", "dep:prost", "dep:tonic-prost-build", "dep:protox", "dep:tokio-stream"]
# TLS for HTTP and gRPC (`--tls-cert`, `--tls-key`, `--tls-client-ca`): rustls with rustls-pure,
# the pure-Rust crypto provider built on RustCrypto (rustls-pure/)
tls = ["dep:rustls", "dep:tokio-rustls", "dep:rustls-pure"]
# Serve LLMs: OpenAI-compatible chat and completions with streaming, behind the `LlmEngine` and
# `StepModel` traits (src/llm). Engines come from other crates, such as furnace-candle.
llm = ["dep:tokenizers", "dep:minijinja", "dep:minijinja-contrib", "dep:chrono"]
# `model::DummyModel` and `model::DummyTensorsModel`: constant models for testing and
# benchmarking the server itself, not for serving
test-models = []

[dependencies]
# furnace's own parts, crates of their own with no dependencies
amate = { path = "amate", version = "0.15.0" }
kuebiko = { path = "kuebiko", version = "0.15.0", features = ["serde"] }

bytes = "1.9"

# Web Framework. axum without `form` and `query` (furnace extracts neither), without
# `matched-path` and `original-uri` (each adds an extension to every request; furnace reads
# neither) and without `tower-log` (logs go through tracing only); tokio with the parts the
# server uses.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "tracing"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "sync", "time", "macros", "signal", "process", "io-util"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }

# Logging, without the `#[instrument]` attribute macro furnace does not use
tracing = { version = "0.1", default-features = false, features = ["std"] }

# Image input (`image` feature)
image = { version = "0.25", default-features = false, features = ["jpeg", "png"], optional = true }

# gRPC transport for the Open Inference Protocol (feature `grpc`)
prost = { version = "0.14", optional = true }
tonic = { version = "0.14", optional = true }
tonic-prost = { version = "0.14", optional = true }
# gRPC over TLS: the accepted connections as the stream tonic serves (feature `grpc`)
tokio-stream = { version = "0.1", optional = true }
# TLS (feature `tls`): rustls without its C-based providers, and rustls-pure, the pure-Rust
# crypto provider of RustCrypto primitives
rustls = { version = "0.23.46", default-features = false, features = ["std", "logging"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging"], optional = true }
# Versioned on its own, apart from the workspace's other crates
rustls-pure = { path = "rustls-pure", version = "0.15", optional = true }
# LLM serving (feature `llm`). tokenizers without its defaults: they build Oniguruma (C) and
# esaxx (C++); fancy-regex is the pure-Rust regex engine. minijinja without `stacker` (cc).
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"], optional = true }
minijinja = { version = "2.24", default-features = false, features = ["builtins", "json", "serde", "macros", "loop_controls", "multi_template"], optional = true }
minijinja-contrib = { version = "2.24", default-features = false, features = ["pycompat"], optional = true }
# The chat templates' `strftime_now`: any strftime format, in the local time zone (feature `llm`)
chrono = { version = "0.4", default-features = false, features = ["clock"], optional = true }
futures-util = { version = "0.3", default-features = false }

[build-dependencies]
# gRPC: a pure-Rust protobuf compiler, so building needs no `protoc`
protox = { version = "0.10", optional = true }
tonic-prost-build = { version = "0.14", optional = true }

[dev-dependencies]
# Paused time (`#[tokio::test(start_paused = true)]`): the overload and failure tests wait out
# timeouts and backoffs without waiting in real time
tokio = { version = "1.53", features = ["test-util"] }
tempfile = "3.12"
# The examples in the documentation install a log subscriber, as a program would
tracing-subscriber = "0.3"
# The tests only call http://127.0.0.1: no TLS stack (its default pulls in aws-lc-sys, C)
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tower = { version = "0.5", features = ["util"] }
# Serves the gRPC tests on an ephemeral port; the nerve unit tests use `tokio_stream::iter`
# from it too, so keep it next to the optional `grpc` dependency rather than merging the two
tokio-stream = { version = "0.1", features = ["net"] }
# Connects the gRPC-over-TLS test's client through the test's own TLS stream
hyper-util = { version = "0.1", features = ["tokio"] }
rand = "0.10"
# Property tests of the parsers and decoders: random valid and broken inputs. Without the
# `fork` and `timeout` features, which the tests do not use
proptest = { version = "1.12", default-features = false, features = ["std"] }

# Model checking with `RUSTFLAGS="--cfg furnace_loom"`: every interleaving of the threads
# sharing a nerve's lane, an effector's local loop or a motor neuron's program
# (src/nerve/sync.rs). Not part of a normal build. A cfg of furnace's own rather than `loom`,
# which tokio reads too: under it tokio leaves out its networking, and the server's tree
# does not build.
[target.'cfg(furnace_loom)'.dev-dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(furnace_loom)"] }

[[test]]
name = "llm"
required-features = ["llm"]


[profile.release]
# Maximum performance optimizations
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
overflow-checks = false

# CI test builds: release optimizations (ResNet-18 stays fast in tests) without the whole-program
# LTO and single codegen unit, which make every test binary take minutes to link
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16

# Build scripts (burn-onnx's model code generation) stay optimized, without the single
# codegen unit that serializes their compilation
[profile.ci.build-override]
opt-level = 3
codegen-units = 16

[profile.release.build-override]
opt-level = 3
codegen-units = 1

[profile.dev]
# Light optimization: still quick to rebuild, and fast enough for the tests that need concurrent
# requests to overlap (request parsing at opt-level 0 serializes them)
opt-level = 1
debug = true
split-debuginfo = "unpacked"

# Dependencies (Burn's CPU kernels above all) are optimized even in debug builds, so `cargo test`
# runs ResNet-18 at a usable speed while furnace's own code still rebuilds quickly
[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.test]
opt-level = 1
debug = true

[profile.bench]
# Optimize for benchmarks
opt-level = 3
debug = false
lto = true

# The profile that 'cargo dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

# Faster 2D convolutions on Burn's CPU backend, for furnace-burn, pending upstream review in
# tracel-ai/burn. furnace-burn/vendor/burn-flex is burn-flex 0.22.0 plus that patch; see
# furnace-burn/vendor/README.md.
[patch.crates-io]
burn-flex = { path = "furnace-burn/vendor/burn-flex" }
