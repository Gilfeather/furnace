[package]
name = "kamui"
version = "0.15.0"
edition = "2024"
rust-version = "1.95"
authors = ["Furnace Contributors"]
description = "A global allocator that keeps freed large blocks for reuse, so repeated model passes skip fresh page faults; no dependencies"
documentation = "https://docs.rs/kamui"
homepage = "https://github.com/Gilfeather/furnace"
repository = "https://github.com/Gilfeather/furnace"
license = "MIT"
keywords = ["allocator", "global-allocator", "cache", "inference"]
categories = ["memory-management"]
readme = "README.md"

[dependencies]

[dev-dependencies]
# Property tests only; the crate itself has no dependencies
proptest = { version = "1.12", default-features = false, features = ["std"] }
