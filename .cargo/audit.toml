# cargo-audit configuration (picked up by `cargo audit` and the Security Audit workflow)

[advisories]
ignore = [
    # zip 0.6.6 path traversal / permission advisories. The only zip left in Cargo.lock comes
    # from tch/torch-sys, the optional LibTorch backend of Burn, which furnace never enables
    # (`cargo tree -i zip --all-features --target all` prints nothing). Remove these once
    # Burn's tch dependency moves to zip >= 9.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
]
