name: Security Audit

# When the dependencies change, and weekly for new advisories against unchanged ones
on:
  schedule:
    # Mondays, 00:00 UTC
    - cron: '0 0 * * 1'
  push:
    branches: [ main ]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**/Cargo.toml'
      - '**/Cargo.lock'
      - 'deny.toml'
      - '.github/workflows/security.yml'
  workflow_dispatch:


# On a pull request a newer push makes an older run redundant; on main every commit runs to the
# end, so the README badge shows a result, never a cancelled run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security_audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    # RustSec advisories for every crate that can be built into furnace, across all features
    # and targets (cargo-deny walks the resolved dependency graph). Unlike `cargo audit`, it does
    # not flag optional dependencies that Cargo.lock records but no feature can enable, such as
    # Burn's LibTorch backend. No advisories are ignored.
    - name: Check advisories
      uses: EmbarkStudios/cargo-deny-action@v2
      with:
        command: check advisories

  cargo_deny:
    name: cargo-deny (licenses, bans, sources)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Run cargo-deny
      uses: EmbarkStudios/cargo-deny-action@v2
      with:
        command: check licenses bans sources

  dependency_review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Dependency Review
      uses: actions/dependency-review-action@v5
      with:
        fail-on-severity: moderate
      # The repository's dependency graph is off, so the action cannot run at all; it can block
      # once Settings → Code security → Dependency graph is enabled
      continue-on-error: true

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    # Pull requests skip the vendored Burn backend (about 40k lines, mostly upstream code), which
    # takes the analysis from about 16 minutes to a few. Pushes to main and the weekly run still
    # scan everything, vendor included.
    - name: Initialize CodeQL (pull request)
      if: github.event_name == 'pull_request'
      uses: github/codeql-action/init@v4
      with:
        languages: 'rust'
        build-mode: none
        queries: security-and-quality
        config: |
          paths-ignore:
            - furnace-burn/vendor
            - benches/compare

    - name: Initialize CodeQL
      if: github.event_name != 'pull_request'
      uses: github/codeql-action/init@v4
      with:
        languages: 'rust'
        build-mode: none
        queries: security-and-quality

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:rust"
