name: Security Audit

# On pull requests that change what each job reads (.github/relevance): the advisories and
# cargo-deny when the lockfile, the manifests or deny.toml change, CodeQL when Rust code does;
# and weekly on main, for new advisories against unchanged dependencies. Every pull request runs
# `Security Audit required`, the job to require before merging.
on:
  schedule:
    # Mondays, 00:00 UTC
    - cron: '0 0 * * 1'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# On a pull request a newer push makes an older run redundant; every other run (scheduled, by
# hand) is a group of its own and runs to the end
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which jobs this run needs (.github/relevance)
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      advisories: ${{ steps.changes.outputs.advisories }}
      deny: ${{ steps.changes.outputs.deny }}
      dependency-review: ${{ steps.changes.outputs['dependency-review'] }}
      codeql: ${{ steps.changes.outputs.codeql }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        filter: blob:none

    - name: Files this workflow checks
      id: changes
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: bash .github/changed-files.sh security

  security_audit:
    name: Security Audit
    needs: changes
    if: needs.changes.outputs.advisories == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    # RustSec advisories for every crate that can be built into furnace, across all features
    # and targets (cargo-deny walks the resolved dependency graph). Unlike `cargo audit`, it does
    # not flag optional dependencies that Cargo.lock records but no feature can enable, such as
    # Burn's LibTorch backend. No advisories are ignored.
    - name: Check advisories
      uses: EmbarkStudios/cargo-deny-action@v2
      with:
        command: check advisories

  cargo_deny:
    name: cargo-deny (licenses, bans, sources)
    needs: changes
    if: needs.changes.outputs.deny == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Run cargo-deny
      uses: EmbarkStudios/cargo-deny-action@v2
      with:
        command: check licenses bans sources

  dependency_review:
    name: Dependency Review
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs['dependency-review'] == 'true'
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Dependency Review
      uses: actions/dependency-review-action@v5
      with:
        fail-on-severity: moderate
      # The repository's dependency graph is off, so the action cannot run at all; it can block
      # once Settings → Code security → Dependency graph is enabled
      continue-on-error: true

  codeql:
    name: CodeQL Analysis
    needs: changes
    if: needs.changes.outputs.codeql == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    # Pull requests skip the vendored Burn backend (about 40k lines, mostly upstream code), which
    # takes the analysis from about 16 minutes to a few. The weekly run on main still scans
    # everything, vendor included.
    - name: Initialize CodeQL (pull request)
      if: github.event_name == 'pull_request'
      uses: github/codeql-action/init@v4
      with:
        languages: 'rust'
        build-mode: none
        queries: security-and-quality
        config: |
          paths-ignore:
            - furnace-burn/vendor
            - benches/compare

    - name: Initialize CodeQL
      if: github.event_name != 'pull_request'
      uses: github/codeql-action/init@v4
      with:
        languages: 'rust'
        build-mode: none
        queries: security-and-quality

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:rust"

  # The check to require before merging: every job above passed, or was skipped as not needed
  required:
    name: Security Audit required
    if: always()
    needs: [changes, security_audit, cargo_deny, dependency_review, codeql]
    runs-on: ubuntu-latest
    steps:
    - name: Every job passed or was skipped
      env:
        NEEDS: ${{ toJSON(needs) }}
        RESULTS: ${{ join(needs.*.result, ' ') }}
      run: |
        echo "$NEEDS"
        for result in $RESULTS; do
          case $result in
            success|skipped) ;;
            *) echo "::error::A job ended in $result"; exit 1 ;;
          esac
        done
