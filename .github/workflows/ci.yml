name: CI

# Pull requests run the few jobs that catch almost everything: tests and lints on Linux, and
# every feature combination type-checked in one job. The rest (other platforms, toolchains,
# the GPU and Metal backends, the vendored kernels, the bench harnesses, furnace-candle,
# coverage) runs on main after a merge and weekly. Changes to docs alone run nothing, except to
# the Markdown files whose Rust examples compile as doc-tests (src/lib.rs, furnace-burn's and
# furnace-candle's src/lib.rs); later patterns override earlier ones.
#
# The workspace's default members are furnace-server (the root), furnace-burn and furnace-cli:
# `cargo test`, `cargo clippy` and `cargo check` without `-p` cover those three. The built-in
# ONNX models go in furnace-burn/models/.
on:
  push:
    branches: [ main ]
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!LICENSE*'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'examples/README.md'
      - 'docs/*.md'
  pull_request:
    branches: [ main ]
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - '!LICENSE*'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'examples/README.md'
      - 'docs/*.md'
  schedule:
    # Mondays, 03:17 UTC
    - cron: '17 3 * * 1'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RESNET18_URL: https://github.com/onnx/models/raw/main/validated/vision/classification/resnet/model/resnet18-v1-7.onnx
  # Second built-in model for the end-to-end tests: different shapes, 26 KB
  MNIST_URL: https://github.com/onnx/models/raw/main/validated/vision/classification/mnist/model/mnist-8.onnx


# A newer push to the same branch or pull request makes an older run of this workflow redundant
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux on pull requests; Windows and macOS too on main
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
        rust: [stable]

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    - name: Cache ONNX models
      uses: actions/cache@v5
      with:
        path: furnace-burn/models
        key: onnx-models-resnet18-v1-7-mnist-8

    - name: Download ONNX models
      shell: bash
      run: |
        mkdir -p furnace-burn/models
        [ -f furnace-burn/models/resnet18.onnx ] || curl -fsSL "$RESNET18_URL" -o furnace-burn/models/resnet18.onnx
        [ -f furnace-burn/models/mnist.onnx ] || curl -fsSL "$MNIST_URL" -o furnace-burn/models/mnist.onnx

    - name: Check formatting
      run: cargo fmt --all -- --check

    - name: Run clippy
      run: |
        cargo clippy --all-targets -- -D warnings
        cargo clippy --all-targets --features "image grpc tls llm" -- -D warnings

    # With the optional image input; the default build's only extra test is its 415. Examples and
    # benches are left to clippy above, which type-checks them without an optimized build.
    - name: Run tests
      run: cargo test --profile ci --lib --bins --tests --features "image grpc tls llm"

    # The examples in the API docs (the crates' front pages among them) and in the Markdown
    # documents compile against the current API; once, they don't depend on the platform.
    # README.md's and examples/README.md's compile with furnace-burn, docs/LLM.md's with
    # furnace-candle, in its job below.
    - name: Run doc-tests
      if: matrix.os == 'ubuntu-latest'
      run: cargo test --profile ci --doc --features "image grpc tls llm"

  # Each optional feature on its own, so a `cfg(feature)` path that only one of them reaches is
  # compiled somewhere, one after another in one job sharing one cache. Clippy without codegen:
  # a type check that also fails on the unused-import warnings an odd combination produces.
  features:
    name: Features and pure-Rust tree
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
      with:
        toolchain: stable
        components: clippy

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    # One small built-in model, so the ONNX code generation and `embed-weights` have something
    # to compile
    - name: Download the MNIST model
      run: |
        mkdir -p furnace-burn/models
        curl -fsSL "$MNIST_URL" -o furnace-burn/models/mnist.onnx

    # The server alone (no feature is on by default), then the Burn adapter and the command
    - name: Clippy per feature
      shell: bash
      run: |
        set -euo pipefail
        for args in "-p furnace-server" \
                    "-p furnace-server --features tls" \
                    "-p furnace-server --features grpc" \
                    "-p furnace-server --features llm" \
                    "-p furnace-server --features image" \
                    "-p furnace-burn" \
                    "-p furnace-burn --features onnx" \
                    "-p furnace-burn --features embed-weights" \
                    "-p furnace-cli --no-default-features" \
                    "-p furnace-cli --features embed-weights"; do
          echo "::group::clippy $args"
          cargo clippy --all-targets $args -- -D warnings
          echo "::endgroup::"
        done
        echo "::group::clippy -p furnace-burn --features wgpu"
        cargo clippy -p furnace-burn --features wgpu -- -D warnings
        echo "::endgroup::"

    # No C or C++: none of these crates may be built for furnace-server with `llm`, with the
    # release features (`grpc tls`, whose crypto is RustCrypto and must not pull ring back in) or
    # with `image`, for furnace-burn, for the `furnace` command, or for furnace-candle, on any of
    # the release targets. Dev-dependencies don't ship and are not checked.
    - name: No C or C++ crates
      shell: bash
      run: |
        set -euo pipefail
        targets=(--target x86_64-unknown-linux-gnu --target x86_64-unknown-linux-musl
                 --target aarch64-unknown-linux-gnu --target x86_64-apple-darwin
                 --target aarch64-apple-darwin --target x86_64-pc-windows-msvc)
        # cc and cmake build C/C++ (Oniguruma, esaxx's C++, ring's assembly); the others are C
        # libraries or bindings to them, or GPU kernels compiled by nvcc
        banned='^(cc|cmake|bindgen|pkg-config|ring|aws-lc-rs|aws-lc-sys|openssl|openssl-sys|onig|onig_sys|cudarc|intel-mkl-src|accelerate-src|candle-kernels|candle-flash-attn|candle-metal-kernels|zstd-sys|libz-sys|bzip2-sys|lzma-sys)$'
        failed=0
        for package in "-p furnace-server --features llm" "-p furnace-server --features grpc,tls" \
                       "-p furnace-server --features image" "-p furnace-burn --features onnx" \
                       "-p furnace-cli --features grpc,tls" "-p furnace-candle"; do
          crates=$(cargo tree $package -e normal,build "${targets[@]}" --prefix none -f '{p}' | awk '{print $1}' | sort -u)
          found=$(grep -E "$banned" <<<"$crates" || true)
          if [ -n "$found" ]; then
            echo "::error::C or C++ crates in $package: $found"
            for crate in $found; do cargo tree $package -e normal,build "${targets[@]}" -i "$crate"; done
            failed=1
          else
            echo "$package: $(wc -l <<<"$crates") crates, no C or C++"
          fi
        done
        # esaxx-rs is pure Rust only without its default `cpp` feature
        if cargo tree -p furnace-candle -e features "${targets[@]}" -i esaxx-rs | grep -q 'esaxx-rs feature "cpp"'; then
          echo "::error::esaxx-rs is built with its C++ implementation"
          failed=1
        fi
        exit $failed

  # Beta and the MSRV only need to compile: a type check, no tests
  toolchains:
    name: Type check (${{ matrix.rust }})
    # On main and weekly only: pull requests run the checks above
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # MSRV: keep in sync with rust-version in Cargo.toml
        rust: [beta, "1.95"]
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
      with:
        toolchain: ${{ matrix.rust }}

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    - name: Download the MNIST model
      run: |
        mkdir -p furnace-burn/models
        curl -fsSL "$MNIST_URL" -o furnace-burn/models/mnist.onnx

    - name: Type check
      run: cargo check --all-targets --features "image grpc tls llm"

  metal:
    name: Features (metal, macOS)
    # On main and weekly only: pull requests run the checks above
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
      with:
        toolchain: stable
        components: clippy

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    - name: Download the MNIST model
      run: |
        mkdir -p furnace-burn/models
        curl -fsSL "$MNIST_URL" -o furnace-burn/models/mnist.onnx

    - name: Clippy
      run: cargo clippy -p furnace-burn -p furnace-cli --all-targets --features metal -- -D warnings

  # The benchmark harnesses have their own workspaces, so `cargo fmt --all` and clippy above
  # never see them. benches/compare links ONNX Runtime and is only type-checked. The helpers
  # they share (benches/common) are a path dependency, which a harness's clippy does not lint.
  bench-harnesses:
    name: Benchmark harnesses
    # On main and weekly only: pull requests run the checks above
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
      with:
        toolchain: stable
        components: rustfmt, clippy

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          benches/burn -> target
          benches/llm -> target
          benches/nerve -> target
          benches/compare -> target
          benches/common -> target

    - name: Check formatting
      shell: bash
      run: |
        for bench in burn llm nerve compare common; do
          cargo fmt --manifest-path "benches/$bench/Cargo.toml" --all -- --check
        done

    - name: Clippy
      shell: bash
      run: |
        for bench in burn llm nerve; do
          cargo clippy --locked --manifest-path "benches/$bench/Cargo.toml" --all-targets -- -D warnings
        done
        cargo clippy --locked --manifest-path benches/common/Cargo.toml --all-targets --all-features -- -D warnings

    - name: Test benches/common
      run: cargo test --locked --manifest-path benches/common/Cargo.toml --all-features

    - name: Type check benches/compare
      run: cargo check --locked --manifest-path benches/compare/Cargo.toml --all-targets

  llm-candle:
    name: furnace-candle (GGUF LLMs through candle)
    # On main and weekly only: pull requests run the checks above
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
      with:
        toolchain: stable
        components: clippy

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    # The tests that need a GGUF file are #[ignore]d: run them locally with
    # FURNACE_QWEN2_GGUF / FURNACE_LLAMA_GGUF and --ignored
    - name: Clippy and tests
      run: |
        cargo clippy -p furnace-candle --all-targets -- -D warnings
        cargo test -p furnace-candle --profile ci

  kubernetes:
    name: Kubernetes manifests
    # On main and weekly only: pull requests run the checks above
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    # The chart's appVersion and the KServe manifests name the image and weights of the release;
    # a version bump in Cargo.toml must move them too
    - name: Versions match Cargo.toml
      run: |
        set -euo pipefail
        version=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
        echo "Cargo.toml: $version"
        failed=0
        check() {
          if grep -qF -- "$2" "$1"; then echo "$1: $2"; else echo "::error file=$1::expected $2"; failed=1; fi
        }
        check deploy/helm/furnace/Chart.yaml "appVersion: \"$version\""
        check deploy/kserve/servingruntime.yaml "ghcr.io/gilfeather/furnace:$version"
        check deploy/kserve/inferenceservice.yaml "/releases/download/v$version/"
        exit $failed
    - uses: azure/setup-helm@v5
    - name: Install kubeconform
      run: |
        curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz
        sudo mv kubeconform /usr/local/bin/
    # The chart with its defaults, and with every option on; KServe's and the Prometheus
    # Operator's resources are checked against the community CRD schemas
    - name: Lint and validate
      run: |
        set -euo pipefail
        schemas=(-schema-location default -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json')
        helm lint deploy/helm/furnace
        helm template furnace deploy/helm/furnace | kubeconform -strict -summary "${schemas[@]}"
        helm template furnace deploy/helm/furnace           --set apiKeys.existingSecret=keys --set adminToken.existingSecret=admin           --set tls.existingSecret=tls --set tls.clientCaSecret=ca           --set rateLimit.perSecond=50 --set rateLimit.burst=100 --set threads=4           --set resources.limits.cpu=2 --set serviceMonitor.enabled=true           --set autoscaling.enabled=true --set 'models={resnet18,mnist}'           | kubeconform -strict -summary "${schemas[@]}"
        kubeconform -strict -summary "${schemas[@]}" deploy/kserve/*.yaml

  vendored-kernels:
    name: Vendored CPU kernels (${{ matrix.os }})
    # On main and weekly only: pull requests run the checks above
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x86_64 (AVX2 / AVX-512 when the runner has it) and aarch64 (NEON)
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
      with:
        toolchain: stable
        components: clippy

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: furnace-burn/vendor/burn-flex

    - name: Clippy
      run: cargo clippy --manifest-path furnace-burn/vendor/burn-flex/Cargo.toml --release --all-targets -- -D warnings

    - name: Run tests
      run: cargo test --manifest-path furnace-burn/vendor/burn-flex/Cargo.toml --release --lib

    # Rough single-threaded numbers for this runner's CPU, for the log only
    - name: Kernel throughput
      env:
        RAYON_NUM_THREADS: "1"
      run: cargo test --manifest-path furnace-burn/vendor/burn-flex/Cargo.toml --release --lib throughput -- --ignored --nocapture --test-threads 1

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    # Ten minutes of instrumented build; on main only, not on every pull request
    if: github.event_name != 'pull_request'
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
      with:
        toolchain: stable
        components: llvm-tools-preview

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    - name: Cache ONNX models
      uses: actions/cache@v5
      with:
        path: furnace-burn/models
        key: onnx-models-resnet18-v1-7-mnist-8

    - name: Download ONNX models
      run: |
        mkdir -p furnace-burn/models
        [ -f furnace-burn/models/resnet18.onnx ] || curl -fsSL "$RESNET18_URL" -o furnace-burn/models/resnet18.onnx
        [ -f furnace-burn/models/mnist.onnx ] || curl -fsSL "$MNIST_URL" -o furnace-burn/models/mnist.onnx

    - name: Generate code coverage
      run: cargo llvm-cov --profile ci --workspace --features "image grpc tls llm" --lcov --output-path lcov.info

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: lcov.info
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
      continue-on-error: true

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
      with:
        toolchain: stable

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    - name: Cache ONNX models
      uses: actions/cache@v5
      with:
        path: furnace-burn/models
        key: onnx-models-resnet18-v1-7-mnist-8

    - name: Download ONNX models
      run: |
        mkdir -p furnace-burn/models
        [ -f furnace-burn/models/resnet18.onnx ] || curl -fsSL "$RESNET18_URL" -o furnace-burn/models/resnet18.onnx
        [ -f furnace-burn/models/mnist.onnx ] || curl -fsSL "$MNIST_URL" -o furnace-burn/models/mnist.onnx

    - name: Run benchmarks
      run: cargo bench -p furnace-burn --bench inference_benchmark --features onnx --no-run
