name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RESNET18_URL: https://github.com/onnx/models/raw/main/validated/vision/classification/resnet/model/resnet18-v1-7.onnx
  # Second built-in model for the end-to-end tests: different shapes, 26 KB
  MNIST_URL: https://github.com/onnx/models/raw/main/validated/vision/classification/mnist/model/mnist-8.onnx


# A newer push to the same branch or pull request makes an older run of this workflow redundant
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
        include:
          # Beta and the MSRV only need to compile: a type check, no tests
          - os: ubuntu-latest
            rust: beta
            check-only: true
          # MSRV (keep in sync with rust-version in Cargo.toml)
          - os: ubuntu-latest
            rust: "1.95"
            check-only: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    - name: Cache ONNX models
      uses: actions/cache@v5
      with:
        path: models
        key: onnx-models-resnet18-v1-7-mnist-8

    - name: Download ONNX models
      shell: bash
      run: |
        mkdir -p models
        [ -f models/resnet18.onnx ] || curl -fsSL "$RESNET18_URL" -o models/resnet18.onnx
        [ -f models/mnist.onnx ] || curl -fsSL "$MNIST_URL" -o models/mnist.onnx

    - name: Check formatting
      if: matrix.rust == 'stable'
      run: cargo fmt --all -- --check

    - name: Run clippy
      if: matrix.rust == 'stable'
      run: |
        cargo clippy --all-targets -- -D warnings
        cargo clippy --all-targets --features "image grpc tls llm nerve" -- -D warnings

    - name: Type check
      if: matrix.check-only
      run: cargo check --all-targets --features "image grpc tls llm nerve"

    # With the optional image input; the default build's only extra test is its 415. Examples and
    # benches are left to clippy above, which type-checks them without an optimized build.
    - name: Run tests
      if: ${{ !matrix.check-only }}
      run: cargo test --profile ci --lib --bins --tests --features "image grpc tls llm nerve"

  llm-candle:
    name: furnace-candle (GGUF LLMs through candle)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    # The tests that need a GGUF file are #[ignore]d: run them locally with
    # FURNACE_QWEN2_GGUF / FURNACE_LLAMA_GGUF and --ignored
    - name: Clippy and tests
      run: |
        cargo clippy -p furnace-candle --all-targets -- -D warnings
        cargo test -p furnace-candle --profile ci

  # No C or C++ in the LLM layer: none of these crates may be built for furnace with `llm`, or
  # for furnace-candle, on any of the release targets. Dev-dependencies don't ship and are not
  # checked.
  pure-rust:
    name: Pure-Rust dependency tree (llm)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: No C or C++ crates
      shell: bash
      run: |
        set -euo pipefail
        targets=(--target x86_64-unknown-linux-gnu --target x86_64-unknown-linux-musl
                 --target aarch64-unknown-linux-gnu --target x86_64-apple-darwin
                 --target aarch64-apple-darwin --target x86_64-pc-windows-msvc)
        # cc and cmake build C/C++ (Oniguruma, esaxx's C++, ring's assembly); the others are C
        # libraries or bindings to them, or GPU kernels compiled by nvcc
        banned='^(cc|cmake|bindgen|pkg-config|ring|aws-lc-rs|aws-lc-sys|openssl|openssl-sys|onig|onig_sys|cudarc|intel-mkl-src|accelerate-src|candle-kernels|candle-flash-attn|candle-metal-kernels|zstd-sys|libz-sys|bzip2-sys|lzma-sys)$'
        failed=0
        for package in "-p furnace-server --features llm,nerve" "-p furnace-server --no-default-features --features llm,nerve" "-p furnace-candle"; do
          crates=$(cargo tree $package -e normal,build "${targets[@]}" --prefix none -f '{p}' | awk '{print $1}' | sort -u)
          found=$(grep -E "$banned" <<<"$crates" || true)
          if [ -n "$found" ]; then
            echo "::error::C or C++ crates in $package: $found"
            for crate in $found; do cargo tree $package -e normal,build "${targets[@]}" -i "$crate"; done
            failed=1
          else
            echo "$package: $(wc -l <<<"$crates") crates, no C or C++"
          fi
        done
        # esaxx-rs is pure Rust only without its default `cpp` feature
        if cargo tree -p furnace-candle -e features "${targets[@]}" -i esaxx-rs | grep -q 'esaxx-rs feature "cpp"'; then
          echo "::error::esaxx-rs is built with its C++ implementation"
          failed=1
        fi
        exit $failed

  gpu-features:
    name: Check GPU backend features
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    - name: Clippy with wgpu backend
      run: cargo clippy --no-default-features --features wgpu -- -D warnings

  kubernetes:
    name: Kubernetes manifests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: azure/setup-helm@v5
    - name: Install kubeconform
      run: |
        curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar xz
        sudo mv kubeconform /usr/local/bin/
    # The chart with its defaults, and with every option on; KServe's and the Prometheus
    # Operator's resources are checked against the community CRD schemas
    - name: Lint and validate
      run: |
        set -euo pipefail
        schemas=(-schema-location default -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json')
        helm lint deploy/helm/furnace
        helm template furnace deploy/helm/furnace | kubeconform -strict -summary "${schemas[@]}"
        helm template furnace deploy/helm/furnace           --set apiKeys.existingSecret=keys --set adminToken.existingSecret=admin           --set tls.existingSecret=tls --set tls.clientCaSecret=ca           --set rateLimit.perSecond=50 --set rateLimit.burst=100 --set threads=4           --set resources.limits.cpu=2 --set serviceMonitor.enabled=true           --set autoscaling.enabled=true --set 'models={resnet18,mnist}'           | kubeconform -strict -summary "${schemas[@]}"
        kubeconform -strict -summary "${schemas[@]}" deploy/kserve/*.yaml

  vendored-kernels:
    name: Vendored CPU kernels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # x86_64 (AVX2 / AVX-512 when the runner has it) and aarch64 (NEON)
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: vendor/burn-flex

    - name: Clippy
      run: cargo clippy --manifest-path vendor/burn-flex/Cargo.toml --release --all-targets -- -D warnings

    - name: Run tests
      run: cargo test --manifest-path vendor/burn-flex/Cargo.toml --release --lib

    # Rough single-threaded numbers for this runner's CPU, for the log only
    - name: Kernel throughput
      env:
        RAYON_NUM_THREADS: "1"
      run: cargo test --manifest-path vendor/burn-flex/Cargo.toml --release --lib throughput -- --ignored --nocapture --test-threads 1

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    # Ten minutes of instrumented build; on main only, not on every pull request
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    - name: Cache ONNX models
      uses: actions/cache@v5
      with:
        path: models
        key: onnx-models-resnet18-v1-7-mnist-8

    - name: Download ONNX models
      run: |
        mkdir -p models
        [ -f models/resnet18.onnx ] || curl -fsSL "$RESNET18_URL" -o models/resnet18.onnx
        [ -f models/mnist.onnx ] || curl -fsSL "$MNIST_URL" -o models/mnist.onnx

    - name: Generate code coverage
      run: cargo llvm-cov --profile ci --workspace --lcov --output-path lcov.info

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: lcov.info
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
      continue-on-error: true

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    - name: Cache ONNX models
      uses: actions/cache@v5
      with:
        path: models
        key: onnx-models-resnet18-v1-7-mnist-8

    - name: Download ONNX models
      run: |
        mkdir -p models
        [ -f models/resnet18.onnx ] || curl -fsSL "$RESNET18_URL" -o models/resnet18.onnx
        [ -f models/mnist.onnx ] || curl -fsSL "$MNIST_URL" -o models/mnist.onnx

    - name: Run benchmarks
      run: cargo bench --bench inference_benchmark
