name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RESNET18_URL: https://github.com/onnx/models/raw/main/validated/vision/classification/resnet/model/resnet18-v1-7.onnx
  # Second built-in model for the end-to-end tests: different shapes, 26 KB
  MNIST_URL: https://github.com/onnx/models/raw/main/validated/vision/classification/mnist/model/mnist-8.onnx

jobs:
  test:
    name: Test Suite
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]
        include:
          - os: ubuntu-latest
            rust: beta
          # MSRV (keep in sync with rust-version in Cargo.toml)
          - os: ubuntu-latest
            rust: "1.95"

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ matrix.rust }}
        components: rustfmt, clippy

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    - name: Cache ONNX models
      uses: actions/cache@v5
      with:
        path: models
        key: onnx-models-resnet18-v1-7-mnist-8

    - name: Download ONNX models
      shell: bash
      run: |
        mkdir -p models
        [ -f models/resnet18.onnx ] || curl -fsSL "$RESNET18_URL" -o models/resnet18.onnx
        [ -f models/mnist.onnx ] || curl -fsSL "$MNIST_URL" -o models/mnist.onnx

    - name: Check formatting
      if: matrix.rust == 'stable'
      run: cargo fmt --all -- --check

    - name: Run clippy
      if: matrix.rust == 'stable'
      run: |
        cargo clippy --all-targets -- -D warnings
        cargo clippy --all-targets --features image -- -D warnings

    # With the optional image input; the default build's only extra test is its 415
    - name: Run tests
      run: cargo test --release --all-targets --features image

  gpu-features:
    name: Check GPU backend features
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    - name: Clippy with wgpu backend
      run: cargo clippy --no-default-features --features wgpu -- -D warnings

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: llvm-tools-preview

    - name: Install cargo-llvm-cov
      uses: taiki-e/install-action@cargo-llvm-cov

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    - name: Cache ONNX models
      uses: actions/cache@v5
      with:
        path: models
        key: onnx-models-resnet18-v1-7-mnist-8

    - name: Download ONNX models
      run: |
        mkdir -p models
        [ -f models/resnet18.onnx ] || curl -fsSL "$RESNET18_URL" -o models/resnet18.onnx
        [ -f models/mnist.onnx ] || curl -fsSL "$MNIST_URL" -o models/mnist.onnx

    - name: Generate code coverage
      run: cargo llvm-cov --release --workspace --lcov --output-path lcov.info

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: lcov.info
        fail_ci_if_error: false
        token: ${{ secrets.CODECOV_TOKEN }}
      continue-on-error: true

  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    - name: Cache ONNX models
      uses: actions/cache@v5
      with:
        path: models
        key: onnx-models-resnet18-v1-7-mnist-8

    - name: Download ONNX models
      run: |
        mkdir -p models
        [ -f models/resnet18.onnx ] || curl -fsSL "$RESNET18_URL" -o models/resnet18.onnx
        [ -f models/mnist.onnx ] || curl -fsSL "$MNIST_URL" -o models/mnist.onnx

    - name: Run benchmarks
      run: cargo bench --bench inference_benchmark
