name: rustls-pure constant time

# Statistical timing tests (dudect style) of every operation in rustls-pure that handles a
# secret: key exchanges, ML-KEM decapsulation of valid against tampered ciphertexts, signing and
# refusing records with a wrong tag (rustls-pure/src/tests/constant_time.rs; what they show and
# what they do not, rustls-pure/CONSTANT_TIME.md). A control runs first, and a runner whose
# control fails reports no result. On a release build, about a minute per target: weekly, by
# hand, and on the pull requests that change rustls-pure's dependencies (a security update of a
# crypto crate is timed before it is merged; .github/relevance). Not on a pull request that
# changes code only: timing on a shared runner is too noisy and slow for every one, and the
# machine-code check and the proofs cover rustls-pure's own code. No `required` check: a noisy
# runner can fail the control, so the result shows on the pull request without blocking it. The
# check of rustls-pure's own machine code, which needs no timing, runs on pull requests in
# rustls-pure.yml and here too, on the same runners.
on:
  pull_request:
    branches: [ main ]
  schedule:
    # Tuesdays, 05:13 UTC
    - cron: '13 5 * * 2'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# On a pull request a newer push makes an older run redundant; every other run (scheduled, by
# hand) is a group of its own and runs to the end
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which jobs this run needs (.github/relevance)
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      timing: ${{ steps.changes.outputs.timing }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        filter: blob:none

    - name: Files this workflow checks
      id: changes
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: bash .github/changed-files.sh rustls-pure-ct

  constant-time:
    name: Constant time (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.timing == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # x86_64 (AES-NI, CLMUL, AVX2) and aarch64 on two kinds of machine, a Linux VM and
        # Apple silicon: the crates pick different code for each, and compilers emit different
        # code for each architecture
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
      with:
        toolchain: stable

    - name: Machine code of rustls-pure's own secret handling
      shell: bash
      run: bash rustls-pure/ct-asm.sh

    - name: Build
      run: cargo test --release -p rustls-pure --lib --no-run

    # What the timing depends on: the CPU, the clock and how much of the time the VM is not
    # running (steal), before and after
    - name: Machine
      shell: bash
      run: |
        if [ "$RUNNER_OS" = Linux ]; then
          lscpu
          cat /sys/devices/system/clocksource/clocksource0/current_clocksource
          sudo dmesg | grep -iE 'arch_timer|clocksource|tsc' || true
          grep '^cpu ' /proc/stat
        else
          sysctl -n machdep.cpu.brand_string hw.ncpu hw.tbfrequency 2>/dev/null || true
        fi

    # On Linux on one core, so the samples are not spread over cores that differ; macOS cannot
    # pin a thread. Every |t| goes to the run's summary, whether it passed or not
    - name: Timing tests
      shell: bash
      run: |
        set -o pipefail
        pin=""
        if [ "$RUNNER_OS" = Linux ]; then pin="taskset -c 1"; fi
        $pin cargo test --release -p rustls-pure --lib constant_time \
          -- --ignored --nocapture --test-threads=1 2>&1 | tee ct.log

    - name: Summary
      if: always()
      shell: bash
      run: |
        if [ "$RUNNER_OS" = Linux ]; then grep '^cpu ' /proc/stat; fi
        {
          echo "### rustls-pure constant time (${{ matrix.os }})"
          echo "|t| < 4.5 means no difference detected; if the control fails, nothing here counts"
          echo '```'
          grep '^ct: ' ct.log || echo "no results"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
