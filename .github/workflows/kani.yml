name: Kani

# Kani's bounded model checking of the code that takes untrusted input or is unsafe:
# rustls-pure's checks of the peer's key shares, records and signatures before they reach the
# RustCrypto crates; kamui's allocator (its unsafe paths on real memory, its cache's bookkeeping
# from any state); the tensor shape and size arithmetic; the raw and JSON input decoders; and
# the nerve HTTP client's response parsing. The proofs are the `#[cfg(kani)] mod verification`
# next to the code; each is bounded with `#[kani::unwind]` so it stays within minutes. Kani runs
# on Linux only. Locally: `cargo install --locked kani-verifier --version 0.68.0 && cargo kani
# setup`, then `cargo kani -p rustls-pure`, `-p kamui` or `-p furnace-server` (with
# `--harness <name> --exact` for one proof).
#
# Every pull request runs `Kani required`, the job to require before merging; the proofs run
# when it changes the files in `changes`, the list of harnesses always. Nightly on main too, with
# kani-nightly.yml's longer harnesses.
on:
  pull_request:
    branches: [ main ]
  schedule:
    # Every night, 02:41 UTC
    - cron: '41 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# On a pull request a newer push makes an older run redundant; every other run (scheduled, by
# hand) is a group of its own and runs to the end
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        filter: blob:none

    - name: Files this workflow checks
      id: changes
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: >-
        bash .github/changed-files.sh 'kamui/**' 'rustls-pure/**' 'src/tensor.rs' 'src/model.rs'
        'src/api/infer.rs' 'src/json_fast.rs' 'src/nerve/wire.rs' 'Cargo.toml' 'Cargo.lock'
        '.github/workflows/kani.yml' '.github/workflows/kani-nightly.yml'
        '.github/changed-files.sh'

  kani:
    name: Kani (${{ matrix.package }})
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package: [rustls-pure]
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Prove
      uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
      with:
        kani-version: '0.68.0'
        args: -p ${{ matrix.package }}

  # kamui and furnace-server one harness per job: a model check can take most of a runner's
  # memory, and the jobs run side by side. The harnesses that take longer than a pull request
  # should wait run nightly instead, at the same bounds (kani-nightly.yml). A new harness gets
  # a line here or there; `check-list` fails the run until it has one.
  harness:
    name: Kani ${{ matrix.package }} ${{ matrix.harness }}
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - { package: kamui, harness: 'verification::take_hands_out_a_block_once_4_slots' }
        - { package: kamui, harness: 'verification::keep_keeps_a_block_or_refuses_it_4_slots' }
        - { package: kamui, harness: 'verification::alloc_and_dealloc_stay_in_bounds_4_slots' }
        - { package: kamui, harness: 'verification::realloc_keeps_the_contents_4_slots' }
        - { package: furnace-server, harness: 'json_fast::verification::number_lengths_take_json_numbers_only' }
        - { package: furnace-server, harness: 'json_fast::verification::cut_pieces_join_back_into_the_span' }
        - { package: furnace-server, harness: 'json_fast::verification::array_spans_lie_between_brackets' }
        - { package: furnace-server, harness: 'model::verification::flat_sizes_never_overflow' }
        - { package: furnace-server, harness: 'nerve::wire::verification::the_head_ends_at_the_first_blank_line' }
        - { package: furnace-server, harness: 'nerve::wire::verification::content_lengths_are_digits_only' }
        - { package: furnace-server, harness: 'nerve::wire::verification::chunk_sizes_are_hex_only' }
        - { package: furnace-server, harness: 'tensor::verification::slice_batch_stays_in_bounds' }
        - { package: furnace-server, harness: 'nerve::wire::verification::status_codes_are_three_digits_in_range' }
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Prove
      uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
      with:
        kani-version: '0.68.0'
        args: -p ${{ matrix.package }} --harness ${{ matrix.harness }} --exact

  # Every `#[kani::proof]` of kamui and furnace-server is in the matrix above or in
  # kani-nightly.yml's (rustls-pure's run all at once, in the first job). On every pull request: a
  # new harness can be anywhere in src.
  check-list:
    name: Every Kani harness runs
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Compare the harnesses with the matrix
      shell: bash
      run: |
        listed=$(cat .github/workflows/kani.yml .github/workflows/kani-nightly.yml |
          grep -o "package: [a-z-]*, harness: '[^']*'" | cut -d"'" -f2 | sed 's/.*:://' | sort)
        found=$(grep -rh -A3 '#\[kani::proof\]' src kamui/src | grep -o 'fn [a-z_0-9]*' | cut -c4- | sort)
        if [ "$listed" != "$found" ]; then
          diff <(echo "$listed") <(echo "$found")
          exit 1
        fi

  # The check to require before merging: every job above passed, or was skipped as not needed
  required:
    name: Kani required
    if: always()
    needs: [changes, kani, harness, check-list]
    runs-on: ubuntu-latest
    steps:
    - name: Every job passed or was skipped
      env:
        NEEDS: ${{ toJSON(needs) }}
        RESULTS: ${{ join(needs.*.result, ' ') }}
      run: |
        echo "$NEEDS"
        for result in $RESULTS; do
          case $result in
            success|skipped) ;;
            *) echo "::error::A job ended in $result"; exit 1 ;;
          esac
        done
