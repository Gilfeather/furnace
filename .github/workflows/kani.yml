name: Kani

# Kani's bounded model checking of the code that takes untrusted input or is unsafe:
# rustls-pure's checks of the peer's key shares, records and signatures before they reach the
# RustCrypto crates; kamui's allocator (its unsafe paths on real memory, its cache's bookkeeping
# from any state); the tensor shape and size arithmetic; the raw and JSON input decoders; and
# the nerve HTTP client's response parsing. The proofs are the `#[cfg(kani)] mod verification`
# next to the code; each is bounded with `#[kani::unwind]` so it stays within minutes. Kani runs
# on Linux only. Locally: `cargo install --locked kani-verifier --version 0.68.0 && cargo kani
# setup`, then `cargo kani -p rustls-pure`, `-p kamui` or `-p furnace-server` (with
# `--harness <name> --exact` for one proof).
#
# Every pull request runs `Kani required`, the job to require before merging. A package's proofs
# run when the pull request changes the files they check or what the package is built from
# (.github/relevance); the list of harnesses always. No schedule: what reaches main was proved on
# its pull request, and kani-nightly.yml proves the longer harnesses on main.
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# On a pull request a newer push makes an older run redundant; a run by hand is a group of its
# own and runs to the end
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which jobs this run needs (.github/relevance)
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      rustls-pure: ${{ steps.changes.outputs['rustls-pure'] }}
      kamui: ${{ steps.changes.outputs.kamui }}
      server: ${{ steps.changes.outputs.server }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        filter: blob:none

    - name: Files this workflow checks
      id: changes
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: bash .github/changed-files.sh kani

  kani:
    name: Kani (${{ matrix.package }})
    needs: changes
    if: needs.changes.outputs['rustls-pure'] == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        package: [rustls-pure]
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Prove
      uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
      with:
        kani-version: '0.68.0'
        args: -p ${{ matrix.package }}

  # kamui's and furnace-server's harnesses that take a minute or two, one job per package that
  # compiles the package once and proves them one after another; the slow ones one per job, side
  # by side, since a model check can take most of a runner's memory. The harnesses that take
  # longer than a pull request should wait run nightly instead, at the same bounds
  # (kani-nightly.yml). A new harness gets a line here or there; `check-list` fails the run until
  # it has one.
  quick-kamui:
    name: Kani kamui, quick harnesses
    needs: changes
    if: needs.changes.outputs.kamui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Prove
      uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
      with:
        kani-version: '0.68.0'
        # Function contracts (`proof_for_contract`, `stub_verified`) are unstable in Kani 0.68
        args: >-
          -p kamui --exact -Z function-contracts -Z stubbing
          --harness verification::take_hands_out_a_block_once_4_slots
          --harness verification::keep_keeps_a_block_or_refuses_it_4_slots
          --harness verification::alloc_and_dealloc_stay_in_bounds_4_slots
          --harness verification::realloc_keeps_the_contents_4_slots

  quick-server:
    name: Kani furnace-server, quick harnesses
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Prove
      uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
      with:
        kani-version: '0.68.0'
        # Function contracts (`proof_for_contract`, `stub_verified`) are unstable in Kani 0.68
        args: >-
          -p furnace-server --exact -Z function-contracts -Z stubbing
          --harness api::infer::verification::raw_fp32_decodes_lengths_0_to_5
          --harness api::infer::verification::raw_int64_decodes_lengths_0_to_5
          --harness api::infer::verification::raw_int32_decodes_lengths_0_to_5
          --harness api::infer::verification::raw_fp32_decodes_lengths_6_to_11
          --harness api::infer::verification::raw_int64_decodes_lengths_6_to_11
          --harness api::infer::verification::raw_int32_decodes_lengths_6_to_11
          --harness api::infer::verification::raw_fp32_decodes_lengths_12_to_17
          --harness api::infer::verification::raw_int64_decodes_lengths_12_to_17
          --harness api::infer::verification::raw_int32_decodes_lengths_12_to_17
          --harness json_fast::verification::number_lengths_take_json_numbers_only
          --harness json_fast::verification::cut_pieces_join_back_into_the_span
          --harness tensor::verification::joined_batch_keeps_its_contract
          --harness nerve::wire::verification::the_head_ends_at_the_first_blank_line
          --harness nerve::wire::verification::chunk_sizes_are_hex_only
          --harness tensor::verification::slice_batch_stays_in_bounds
          --harness nerve::wire::verification::status_codes_are_three_digits_in_range

  harness-server:
    name: Kani ${{ matrix.package }} ${{ matrix.harness }}
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - { package: furnace-server, harness: 'json_fast::verification::array_spans_lie_between_brackets' }
        - { package: furnace-server, harness: 'model::verification::flat_sizes_never_overflow' }
        - { package: furnace-server, harness: 'nerve::wire::verification::content_lengths_are_digits_only' }
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Prove
      uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
      with:
        kani-version: '0.68.0'
        # Function contracts (`proof_for_contract`, `stub_verified`) are unstable in Kani 0.68
        args: -p ${{ matrix.package }} --harness ${{ matrix.harness }} --exact -Z function-contracts -Z stubbing

  # Every `#[kani::proof]` and `#[kani::proof_for_contract]` of kamui and furnace-server is in a
  # job above (a `--harness` line or a matrix row) or in kani-nightly.yml's matrix (rustls-pure's
  # run all at once, in the first job). On every pull request: a new harness can be anywhere in
  # src.
  check-list:
    name: Every Kani harness runs
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Compare the harnesses with the matrix
      shell: bash
      run: |
        workflows=(.github/workflows/kani.yml .github/workflows/kani-nightly.yml)
        listed=$({ cat "${workflows[@]}" | grep -o "package: [a-z-]*, harness: '[^']*'" | cut -d"'" -f2
                   cat "${workflows[@]}" | grep -oE -- "--harness [a-z_][a-z_:0-9]*" | cut -d' ' -f2
                 } | sed 's/.*:://' | sort)
        # The first `fn` after each `#[kani::proof]` or `#[kani::proof_for_contract(..)]`
        found=$(find src kamui/src -name '*.rs' -exec awk '
          /#\[kani::proof(_for_contract\(.*\))?\]/ { want = 1; next }
          want && match($0, /fn [a-z_0-9]+/) { print substr($0, RSTART + 3, RLENGTH - 3); want = 0 }
        ' {} + | sort)
        if [ "$listed" != "$found" ]; then
          diff <(echo "$listed") <(echo "$found")
          exit 1
        fi

  # The check to require before merging: every job above passed, or was skipped as not needed
  required:
    name: Kani required
    if: always()
    needs: [changes, kani, quick-kamui, quick-server, harness-server, check-list]
    runs-on: ubuntu-latest
    steps:
    - name: Every job passed or was skipped
      env:
        NEEDS: ${{ toJSON(needs) }}
        RESULTS: ${{ join(needs.*.result, ' ') }}
      run: |
        echo "$NEEDS"
        for result in $RESULTS; do
          case $result in
            success|skipped) ;;
            *) echo "::error::A job ended in $result"; exit 1 ;;
          esac
        done
