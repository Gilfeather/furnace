name: rustls-pure

# rustls-pure against other TLS implementations (OpenSSL, GnuTLS, curl), weekly and on pull
# requests that change it, with a check of its own machine code that handles secrets; and, weekly
# only, against the newest rustls its version range allows and on its minimum supported Rust
# version, which depend on what others release. Its unit, handshake and property tests run in the
# CI workflow with the rest. Every pull request runs `rustls-pure required`, the job to require
# before merging.
on:
  schedule:
    # Mondays, 04:37 UTC
    - cron: '37 4 * * 1'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# On a pull request a newer push makes an older run redundant; every other run (scheduled, by
# hand) is a group of its own and runs to the end
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        filter: blob:none

    - name: Files this workflow checks
      id: changes
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: >-
        bash .github/changed-files.sh 'rustls-pure/**' '.github/workflows/rustls-pure.yml'
        '.github/changed-files.sh'

  latest-rustls:
    name: Newest rustls (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
      with:
        toolchain: stable

    # The newest rustls within rustls-pure's range (Cargo.toml), with whatever it needs
    - name: Update rustls
      run: |
        cargo update --recursive rustls
        cargo tree -p rustls-pure -i rustls --depth 0

    - name: Test
      run: cargo test -p rustls-pure

    # What a user builds: no C or assembly, so none of the crates that compile them
    - name: Check that no C dependency is built
      shell: bash
      run: |
        deps=$(cargo tree -p rustls-pure -e normal,build --prefix none --format '{p}' | sort -u)
        echo "$deps"
        if echo "$deps" | grep -E '^(cc|cmake|ring|aws-lc-rs|aws-lc-sys|openssl-sys) '; then
          echo "::error::rustls-pure now builds C code"
          exit 1
        fi

  msrv:
    name: Minimum supported Rust version
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Read the MSRV
      id: msrv
      run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' rustls-pure/Cargo.toml)" >> "$GITHUB_OUTPUT"

    - name: Install Rust ${{ steps.msrv.outputs.version }}
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
      with:
        toolchain: ${{ steps.msrv.outputs.version }}

    # The lockfile's versions; a dependency update that needs a newer Rust shows up here
    - name: Test
      run: cargo test -p rustls-pure --locked

  # rustls-pure's own code that handles secrets, as compiled: no branch, call or indexed load
  # (ct-asm.sh; the timing tests are in rustls-pure-ct.yml)
  machine-code:
    name: Constant-time machine code (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
      with:
        toolchain: stable

    - name: Check
      shell: bash
      run: bash rustls-pure/ct-asm.sh

  # No C or assembly, so it builds for targets the providers on C do not reach: RISC-V, WASI,
  # and the browser, where an application chooses getrandom's and rustls-pki-types' web backends
  # (README, "Targets")
  targets:
    name: Builds for other targets
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
      with:
        toolchain: stable
        targets: riscv64gc-unknown-linux-gnu,wasm32-wasip2,wasm32-unknown-unknown

    - name: RISC-V and WASI
      run: |
        cargo check -p rustls-pure --target riscv64gc-unknown-linux-gnu
        cargo check -p rustls-pure --target wasm32-wasip2

    # As an application in the browser would depend on it
    - name: Browser (wasm32-unknown-unknown)
      run: |
        mkdir -p "$RUNNER_TEMP/browser/src"
        cat > "$RUNNER_TEMP/browser/Cargo.toml" <<EOF
        [package]
        name = "browser"
        version = "0.0.0"
        edition = "2024"
        publish = false

        [workspace]

        [dependencies]
        rustls = { version = "0.23.46", default-features = false, features = ["std"] }
        rustls-pure = { path = "$GITHUB_WORKSPACE/rustls-pure" }
        getrandom = { version = "0.4", features = ["wasm_js"] }
        rustls-pki-types = { version = "1", features = ["web"] }
        EOF
        echo 'pub fn provider() -> rustls::crypto::CryptoProvider { rustls_pure::provider() }' \
          > "$RUNNER_TEMP/browser/src/lib.rs"
        cargo check --manifest-path "$RUNNER_TEMP/browser/Cargo.toml" --target wasm32-unknown-unknown

  # REQUIRE_MLKEM: the OpenSSL here must have X25519MLKEM768 (3.5 or later), so the post-quantum
  # checks cannot be skipped quietly
  interop-linux:
    name: Interoperability (Linux)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    # Debian 13 has OpenSSL 3.5; the Ubuntu runner's is 3.0, without ML-KEM
    container: rust:1-trixie
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install OpenSSL, GnuTLS and curl
      run: apt-get update && apt-get install -y --no-install-recommends openssl gnutls-bin curl

    - name: Interoperability tests
      env:
        REQUIRE_MLKEM: '1'
      run: bash rustls-pure/interop/run.sh

  interop-macos:
    name: Interoperability (macOS)
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
      with:
        toolchain: stable

    # macOS's own openssl and curl are on LibreSSL, and that curl cannot be asked for TLS 1.3;
    # the test takes OpenSSL 3, GnuTLS and curl (on OpenSSL) from Homebrew
    - name: Install OpenSSL 3, GnuTLS and curl
      run: |
        brew install openssl@3 gnutls curl
        echo "OPENSSL=$(brew --prefix openssl@3)/bin/openssl" >> "$GITHUB_ENV"
        echo "$(brew --prefix curl)/bin" >> "$GITHUB_PATH"

    - name: Interoperability tests
      env:
        REQUIRE_MLKEM: '1'
      run: bash rustls-pure/interop/run.sh

  # The check to require before merging: every job above passed, or was skipped as not needed
  required:
    name: rustls-pure required
    if: always()
    needs: [changes, latest-rustls, msrv, machine-code, targets, interop-linux, interop-macos]
    runs-on: ubuntu-latest
    steps:
    - name: Every job passed or was skipped
      env:
        NEEDS: ${{ toJSON(needs) }}
        RESULTS: ${{ join(needs.*.result, ' ') }}
      run: |
        echo "$NEEDS"
        for result in $RESULTS; do
          case $result in
            success|skipped) ;;
            *) echo "::error::A job ended in $result"; exit 1 ;;
          esac
        done
