name: rustls-pure

# rustls-pure against other TLS implementations (OpenSSL, GnuTLS, curl), weekly and on pull
# requests that change it; and, weekly only, against the newest rustls its version range allows
# and on its minimum supported Rust version, which depend on what others release. Its unit,
# handshake and property tests run in the CI workflow with the rest.
on:
  schedule:
    # Mondays, 04:37 UTC
    - cron: '37 4 * * 1'
  pull_request:
    branches: [ main ]
    paths:
      - 'rustls-pure/**'
      - '.github/workflows/rustls-pure.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A newer push to the same pull request makes an older run redundant
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latest-rustls:
    name: Newest rustls (${{ matrix.os }})
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
      with:
        toolchain: stable

    # The newest rustls within rustls-pure's range (Cargo.toml), with whatever it needs
    - name: Update rustls
      run: |
        cargo update --recursive rustls
        cargo tree -p rustls-pure -i rustls --depth 0

    - name: Test
      run: cargo test -p rustls-pure

    # What a user builds: no C or assembly, so none of the crates that compile them
    - name: Check that no C dependency is built
      shell: bash
      run: |
        deps=$(cargo tree -p rustls-pure -e normal,build --prefix none --format '{p}' | sort -u)
        echo "$deps"
        if echo "$deps" | grep -E '^(cc|cmake|ring|aws-lc-rs|aws-lc-sys|openssl-sys) '; then
          echo "::error::rustls-pure now builds C code"
          exit 1
        fi

  msrv:
    name: Minimum supported Rust version
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Read the MSRV
      id: msrv
      run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' rustls-pure/Cargo.toml)" >> "$GITHUB_OUTPUT"

    - name: Install Rust ${{ steps.msrv.outputs.version }}
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
      with:
        toolchain: ${{ steps.msrv.outputs.version }}

    # The lockfile's versions; a dependency update that needs a newer Rust shows up here
    - name: Test
      run: cargo test -p rustls-pure --locked

  # REQUIRE_MLKEM: the OpenSSL here must have X25519MLKEM768 (3.5 or later), so the post-quantum
  # checks cannot be skipped quietly
  interop-linux:
    name: Interoperability (Linux)
    runs-on: ubuntu-latest
    # Debian 13 has OpenSSL 3.5; the Ubuntu runner's is 3.0, without ML-KEM
    container: rust:1-trixie
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install OpenSSL, GnuTLS and curl
      run: apt-get update && apt-get install -y --no-install-recommends openssl gnutls-bin curl

    - name: Interoperability tests
      env:
        REQUIRE_MLKEM: '1'
      run: bash rustls-pure/interop/run.sh

  interop-macos:
    name: Interoperability (macOS)
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
      with:
        toolchain: stable

    # macOS's own openssl is LibreSSL; the test wants OpenSSL 3 (and GnuTLS) from Homebrew
    - name: Install OpenSSL 3 and GnuTLS
      run: |
        brew install openssl@3 gnutls
        echo "OPENSSL=$(brew --prefix openssl@3)/bin/openssl" >> "$GITHUB_ENV"

    - name: Interoperability tests
      env:
        REQUIRE_MLKEM: '1'
      run: bash rustls-pure/interop/run.sh
