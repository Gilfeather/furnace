name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  packages: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get version from tag
      id: get_version
      run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref }}
        name: Release ${{ github.ref }}
        draft: false
        prerelease: false
        generate_release_notes: true
        body: |
          ## 🔥 Furnace ${{ steps.get_version.outputs.version }}

          Lightweight Rust ML inference server powered by the Burn framework.
          Download the binary for your platform plus `resnet18.bpk` (weights), and place them
          side by side:

          ```bash
          ./furnace --model-name resnet18 --port 3000
          # or point at the weights explicitly
          ./furnace --model-name resnet18 --weights /path/to/resnet18.bpk
          ```

          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for detailed changes.

  build-release:
    name: Build Release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: furnace-linux-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_name: furnace-linux-x86_64-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_name: furnace-linux-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: furnace-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: furnace-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: furnace-macos-aarch64

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Install musl tools
      if: matrix.target == 'x86_64-unknown-linux-musl'
      run: |
        sudo apt-get update
        sudo apt-get install -y musl-tools

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}

    - name: Download ResNet-18 ONNX model
      shell: bash
      run: |
        mkdir -p models
        curl -fsSL "https://github.com/onnx/models/raw/main/validated/vision/classification/resnet/model/resnet18-v1-7.onnx" -o models/resnet18.onnx

    - name: Build release binary
      run: cargo build --release --target ${{ matrix.target }}

    - name: Rename binary
      shell: bash
      run: |
        mkdir -p release-assets
        cp target/${{ matrix.target }}/release/furnace${{ matrix.os == 'windows-latest' && '.exe' || '' }} release-assets/${{ matrix.asset_name }}

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: release-assets/${{ matrix.asset_name }}

    # Weights are platform-independent; publish them once
    - name: Upload ResNet-18 weights
      if: matrix.target == 'x86_64-unknown-linux-gnu'
      uses: softprops/action-gh-release@v2
      with:
        files: target/${{ matrix.target }}/release/build/furnace-server-*/out/models/resnet18.bpk

  publish-crate:
    name: Publish to crates.io
    needs: [create-release, build-release]
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable

    # The crate is published without models; `cargo install` users compile their own in with
    # FURNACE_MODELS_DIR. Skips (with a notice) until the repository has the secret.
    - name: Publish furnace-server
      env:
        CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      run: |
        if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
          echo "::notice::CARGO_REGISTRY_TOKEN is not set; skipping crates.io publish"
          exit 0
        fi
        cargo publish --locked
