name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write
  packages: write

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Get version from tag
      id: get_version
      run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.ref }}
        name: Release ${{ github.ref }}
        draft: false
        prerelease: false
        generate_release_notes: true
        body: |
          ## 🔥 Furnace ${{ steps.get_version.outputs.version }}

          An inference server for Burn models, in pure Rust. Download the binary for your
          platform plus `resnet18.bpk` (weights), and place them side by side:

          ```bash
          ./furnace --model-name resnet18 --port 3000
          # or point at the weights explicitly
          ./furnace --model-name resnet18 --weights /path/to/resnet18.bpk
          ```

          Or `brew install gilfeather/tap/furnace`, or `docker run -p 3000:3000 ghcr.io/gilfeather/furnace`.

          **Verifying a download**: `SHA256SUMS` lists every asset's checksum, `furnace.spdx.json`
          is the software bill of materials, and every binary and image carries a build provenance
          attestation: `gh attestation verify furnace-linux-x86_64 --repo ${{ github.repository }}`.

          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for detailed changes.

  build-release:
    name: Build Release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: furnace-linux-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_name: furnace-linux-x86_64-musl
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_name: furnace-linux-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: furnace-windows-x86_64.exe
          - os: macos-latest
            target: x86_64-apple-darwin
            asset_name: furnace-macos-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            asset_name: furnace-macos-aarch64

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
      with:
        toolchain: stable
        targets: ${{ matrix.target }}

    - name: Install musl tools
      if: matrix.target == 'x86_64-unknown-linux-musl'
      run: |
        sudo apt-get update
        sudo apt-get install -y musl-tools

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}

    - name: Download ResNet-18 ONNX model
      shell: bash
      run: |
        mkdir -p furnace-burn/models
        curl -fsSL "https://github.com/onnx/models/raw/main/validated/vision/classification/resnet/model/resnet18-v1-7.onnx" -o furnace-burn/models/resnet18.onnx

    - name: Build release binary
      run: cargo build --release --locked --target ${{ matrix.target }} -p furnace-cli --features "grpc tls"

    - name: Rename binary
      shell: bash
      run: |
        mkdir -p release-assets
        cp target/${{ matrix.target }}/release/furnace${{ matrix.os == 'windows-latest' && '.exe' || '' }} release-assets/${{ matrix.asset_name }}

    # Signed statement (Sigstore) of which workflow, commit and runner built this binary
    - name: Attest build provenance
      uses: actions/attest-build-provenance@v4
      with:
        subject-path: release-assets/${{ matrix.asset_name }}

    - name: Upload Release Asset
      uses: softprops/action-gh-release@v3
      with:
        files: release-assets/${{ matrix.asset_name }}

    # Weights are platform-independent; publish them once
    - name: Upload ResNet-18 weights
      if: matrix.target == 'x86_64-unknown-linux-gnu'
      uses: softprops/action-gh-release@v3
      with:
        files: target/${{ matrix.target }}/release/build/furnace-burn-*/out/models/resnet18.bpk

  # Checksums of every asset, and a software bill of materials of the source tree
  release-checksums:
    name: Checksums and SBOM
    needs: [create-release, build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: SBOM (SPDX)
      uses: anchore/sbom-action@v0
      with:
        path: .
        format: spdx-json
        output-file: furnace.spdx.json
        upload-artifact: false

    - name: Checksums
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        mkdir assets
        gh release download "$GITHUB_REF_NAME" --dir assets --repo "$GITHUB_REPOSITORY"
        cp furnace.spdx.json assets/
        (cd assets && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)

    - name: Upload checksums and SBOM
      uses: softprops/action-gh-release@v3
      with:
        files: |
          assets/SHA256SUMS
          assets/furnace.spdx.json

  # The formula in Gilfeather/homebrew-tap (`brew install gilfeather/tap/furnace`), written from
  # packaging/homebrew/furnace.rb.in with the SHA-256 GitHub records for each asset. Pushes with a
  # deploy key that can write to the tap and nothing else.
  homebrew:
    name: Homebrew formula
    needs: [create-release, build-release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Check out the tap
      uses: actions/checkout@v5
      with:
        repository: Gilfeather/homebrew-tap
        ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        path: tap

    - name: Update the formula
      env:
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ needs.create-release.outputs.version }}
      run: |
        mkdir -p tap/Formula
        bash packaging/homebrew/render.sh "$VERSION" > tap/Formula/furnace.rb
        cd tap
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add Formula/furnace.rb
        if git diff --cached --quiet; then
          echo "Formula already at $VERSION"
        else
          git commit -m "furnace $VERSION"
          git push
        fi

  publish-crate:
    name: Publish to crates.io
    needs: [create-release, build-release]
    runs-on: ubuntu-latest
    # crates.io Trusted Publishing: the workflow exchanges its OIDC token for a short-lived
    # crates.io token, so no long-lived registry token is stored in the repository
    permissions:
      contents: read
      id-token: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
      with:
        toolchain: stable

    # In the order they depend on each other: furnace-burn needs furnace-server of the same
    # version on crates.io, furnace-cli needs both. `cargo publish` waits until the crate it
    # uploaded is in the index before it returns, so the next one finds it. Each crate gets its
    # own token: a Trusted Publishing token expires after 30 minutes, and verifying furnace-burn
    # and furnace-cli (a build of Burn each) can take longer than that.
    - name: Authenticate with crates.io (furnace-server)
      id: auth-server
      uses: rust-lang/crates-io-auth-action@v1

    - name: Publish furnace-server
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth-server.outputs.token }}
      run: cargo publish --locked -p furnace-server

    # Trusted Publishing works only for a crate that is already on crates.io: the first release
    # of furnace-burn and furnace-cli is published by hand with an API token, after which their
    # Trusted Publishing is set up on crates.io and the repository variable
    # PUBLISH_BURN_CRATES=true has these steps publish them with every release (see
    # DEVELOPMENT.md). furnace-cli is published without models: `cargo install` users compile
    # their own in with FURNACE_MODELS_DIR.
    - name: Authenticate with crates.io (furnace-burn)
      if: vars.PUBLISH_BURN_CRATES == 'true'
      id: auth-burn
      uses: rust-lang/crates-io-auth-action@v1

    - name: Publish furnace-burn
      if: vars.PUBLISH_BURN_CRATES == 'true'
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth-burn.outputs.token }}
      run: cargo publish --locked -p furnace-burn

    - name: Authenticate with crates.io (furnace-cli)
      if: vars.PUBLISH_BURN_CRATES == 'true'
      id: auth-cli
      uses: rust-lang/crates-io-auth-action@v1

    - name: Publish furnace-cli
      if: vars.PUBLISH_BURN_CRATES == 'true'
      env:
        CARGO_REGISTRY_TOKEN: ${{ steps.auth-cli.outputs.token }}
      run: cargo publish --locked -p furnace-cli

  # Container image on GitHub Container Registry: ghcr.io/<owner>/furnace:<version> and :latest,
  # for linux/amd64 and linux/arm64. Each architecture builds natively on its own runner (no
  # emulation), then one manifest list joins them under the shared tags.
  docker-image:
    name: Docker image (${{ matrix.arch }})
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: amd64
          - os: ubuntu-24.04-arm
            arch: arm64
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Download ONNX models
      run: |
        mkdir -p furnace-burn/models
        curl -fsSL "https://github.com/onnx/models/raw/main/validated/vision/classification/resnet/model/resnet18-v1-7.onnx" -o furnace-burn/models/resnet18.onnx
        curl -fsSL "https://github.com/onnx/models/raw/main/validated/vision/classification/mnist/model/mnist-8.onnx" -o furnace-burn/models/mnist.onnx

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Image name
      id: image
      run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

    - name: Build and push
      id: push
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        # The same features as the release binaries (the Dockerfile's default)
        build-args: FEATURES=grpc tls
        tags: ${{ steps.image.outputs.name }}:${{ needs.create-release.outputs.version }}-${{ matrix.arch }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.version=${{ needs.create-release.outputs.version }}
          org.opencontainers.image.licenses=MIT

    - name: Attest build provenance
      uses: actions/attest-build-provenance@v4
      with:
        subject-name: ${{ steps.image.outputs.name }}
        subject-digest: ${{ steps.push.outputs.digest }}
        push-to-registry: true

  docker-manifest:
    name: Docker image (multi-arch tags)
    needs: [create-release, docker-image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Tag the version and latest
      env:
        VERSION: ${{ needs.create-release.outputs.version }}
      run: |
        image="ghcr.io/${GITHUB_REPOSITORY,,}"
        docker buildx imagetools create \
          -t "$image:$VERSION" -t "$image:latest" \
          "$image:$VERSION-amd64" "$image:$VERSION-arm64"
        docker buildx imagetools inspect "$image:$VERSION"
