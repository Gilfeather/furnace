name: Miri

# The workspace's unsafe code run under Miri, which checks every memory access against Rust's
# rules: out of bounds, use after free, double free, misaligned access, data races, leaks and
# aliasing. That code is kamui's allocator (its unit tests, and its integration tests with
# kamui as the process's global allocator). The rest of the workspace has no unsafe of its
# own but furnace-burn's weight mapping, which Miri cannot run (it maps a file), and
# rustls-pure forbids it. Both aliasing models Rust may adopt: Stacked Borrows, and Tree
# Borrows. Strict provenance under both: a pointer is never made up from an integer. On pull
# requests that change kamui, and weekly on main. Every pull request runs `Miri required`, the
# job to require before merging.
#
# On Linux only: there `System` hands over-aligned blocks to `posix_memalign`, which Miri
# models. Windows' `System` keeps a header in front of an over-aligned block and reads it on
# free, outside the bytes the freed `Box` may touch; Miri reports that as undefined behaviour
# in std itself, with std's `System` as the only allocator and no kamui at all.
on:
  pull_request:
    branches: [ main ]
  schedule:
    # Mondays, 04:30 UTC
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# On a pull request a newer push makes an older run redundant; every other run (scheduled, by
# hand) is a group of its own and runs to the end
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        filter: blob:none

    - name: Files this workflow checks
      id: changes
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: >-
        bash .github/changed-files.sh 'kamui/**' 'Cargo.toml' 'Cargo.lock'
        '.github/workflows/miri.yml' '.github/changed-files.sh'

  miri:
    name: Miri (${{ matrix.model.name }})
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        model:
          - name: Stacked Borrows
            flags: -Zmiri-strict-provenance
          - name: Tree Borrows
            flags: -Zmiri-strict-provenance -Zmiri-tree-borrows
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    # Miri ships with nightly only; a pinned one, so a new nightly never breaks a pull request
    # that did not change anything. The date moves in a pull request of its own.
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
      with:
        toolchain: nightly-2026-10-20
        components: miri, rust-src

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        key: miri

    - name: Build Miri's standard library
      run: cargo miri setup

    - name: kamui
      env:
        MIRIFLAGS: ${{ matrix.model.flags }}
      run: cargo miri test -p kamui

  # The check to require before merging: every job above passed, or was skipped as not needed
  required:
    name: Miri required
    if: always()
    needs: [changes, miri]
    runs-on: ubuntu-latest
    steps:
    - name: Every job passed or was skipped
      env:
        NEEDS: ${{ toJSON(needs) }}
        RESULTS: ${{ join(needs.*.result, ' ') }}
      run: |
        echo "$NEEDS"
        for result in $RESULTS; do
          case $result in
            success|skipped) ;;
            *) echo "::error::A job ended in $result"; exit 1 ;;
          esac
        done
