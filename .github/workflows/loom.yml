name: Loom

# Model checks of the concurrent parts with loom: every interleaving of a few threads sharing
# amate's queue (submitters, arrivals, workers), a nerve's lane, an effector's local loop and a
# motor neuron's program slot. They are the `model_check` modules, built only with the cfg that
# makes each crate's `sync` module swap std's locks and atomics for loom's: `loom` for amate,
# which has no dependencies, and `furnace_loom` for the server, whose tokio reads `loom` too
# (and leaves out its networking under it). On pull requests that change those parts, and
# nightly on main. Every pull request runs `Loom required`, the job to require before merging.
on:
  pull_request:
    branches: [ main ]
  schedule:
    # Every night, 03:29 UTC
    - cron: '29 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Interleavings with up to three preemptions: enough for every bug these models have found,
  # and minutes rather than hours
  LOOM_MAX_PREEMPTIONS: 3

# On a pull request a newer push makes an older run redundant; every other run (scheduled, by
# hand) is a group of its own and runs to the end
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        filter: blob:none

    - name: Files this workflow checks
      id: changes
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      run: >-
        bash .github/changed-files.sh 'amate/**' 'src/nerve/**' 'Cargo.toml' 'Cargo.lock'
        '.github/workflows/loom.yml' '.github/changed-files.sh'

  loom:
    name: Loom models
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
      with:
        toolchain: stable

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2

    # Under loom amate's other tests are left out: its parts work only inside a model
    - name: amate
      env:
        RUSTFLAGS: --cfg loom
      run: cargo test -p amate --release --lib

    # The server's other tests build too but do not run (their lanes and effectors would be
    # loom's, outside a model). The ci profile: release optimizations without the whole-program
    # LTO, which only slows the link.
    - name: Nerve lanes, effectors and motor neurons
      env:
        RUSTFLAGS: --cfg furnace_loom
      run: cargo test -p furnace-server --profile ci --lib model_check

  # The check to require before merging: every job above passed, or was skipped as not needed
  required:
    name: Loom required
    if: always()
    needs: [changes, loom]
    runs-on: ubuntu-latest
    steps:
    - name: Every job passed or was skipped
      env:
        NEEDS: ${{ toJSON(needs) }}
        RESULTS: ${{ join(needs.*.result, ' ') }}
      run: |
        echo "$NEEDS"
        for result in $RESULTS; do
          case $result in
            success|skipped) ;;
            *) echo "::error::A job ended in $result"; exit 1 ;;
          esac
        done
