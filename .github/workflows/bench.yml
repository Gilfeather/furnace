name: Benchmarks

# Furnace against a hand-written axum server and FastAPI, on GitHub's own runners, so anyone can
# see the hardware and rerun the comparison. Shared runners are noisy: the ratios between servers
# measured on the same runner matter, not the absolute numbers. Too slow for every pull request.
# A manual run with `update_readme` also opens a pull request with README.md's numbers from the
# x86_64 runner (benches/readme-numbers.sh); the weekly and release runs never change it.
on:
  workflow_dispatch:
    inputs:
      update_readme:
        description: Open a pull request that updates README.md with the x86_64 results
        type: boolean
        default: false
  schedule:
    # Mondays, 04:23 UTC
    - cron: '23 4 * * 1'
  release:
    types: [published]

permissions:
  contents: read

# A newer manual run on a branch makes an older one redundant; a weekly or release run is a group
# of its own and runs to the end
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' }}

env:
  CARGO_TERM_COLOR: always
  # Each figure is the median of this many runs
  RUNS: 3
  RESNET18_URL: https://github.com/onnx/models/raw/main/validated/vision/classification/resnet/model/resnet18-v1-7.onnx

jobs:
  bench:
    name: Benchmarks (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
      with:
        toolchain: stable

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        key: bench
        workspaces: |
          . -> target
          benches/burn -> target
          benches/llm -> target
          benches/nerve -> target

    # Python only for the FastAPI servers compared against, at the versions the published numbers
    # were measured with
    - name: Install Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.14'

    - name: Install FastAPI
      shell: bash
      run: |
        python -m pip install --disable-pip-version-check -r benches/compare/fastapi-ort/requirements.txt
        echo "FURNACE_BENCH_PYTHON=$(command -v python)" >> "$GITHUB_ENV"

    - name: Describe the runner
      shell: bash
      run: |
        mkdir -p results
        lscpu | tee results/lscpu.txt
        model=$(lscpu | sed -n 's/^Model name: *//p' | head -1)
        cores=$(nproc)
        jq -n --arg model "$model" --argjson cores "$cores" --arg arch "${{ matrix.arch }}" \
          '{model: $model, cores: $cores, arch: $arch}' > results/cpu.json
        # The clients share the runner with the server: on fewer than 4 cores, 16 clients would
        # measure the clients
        if [ "$cores" -ge 4 ]; then clients=1,4,16; else clients=1,2,4; fi
        echo "BURN_CLIENTS=$clients" >> "$GITHUB_ENV"

    - name: Cache ONNX models
      uses: actions/cache@v5
      with:
        path: furnace-burn/models
        key: onnx-models-resnet18-v1-7

    - name: Download ResNet-18 ONNX model
      shell: bash
      run: |
        mkdir -p furnace-burn/models
        [ -f furnace-burn/models/resnet18.onnx ] || curl -fsSL "$RESNET18_URL" -o furnace-burn/models/resnet18.onnx

    # The furnace binary as released, with its ResNet-18 weights next to it
    - name: Build furnace
      shell: bash
      run: |
        cargo build --release --locked --bin furnace --features "grpc tls"
        mkdir -p dist
        cp target/release/furnace dist/
        cp "$(ls -t target/release/build/furnace-burn-*/out/models/resnet18.bpk | head -1)" dist/

    - name: Build the harnesses
      shell: bash
      run: |
        cargo build --release --locked --manifest-path benches/burn/Cargo.toml
        cargo build --release --locked --manifest-path benches/llm/Cargo.toml
        cargo build --release --locked --manifest-path benches/nerve/Cargo.toml

    - name: Burn models (benches/burn)
      shell: bash
      run: |
        benches/burn/target/release/furnace-burn-bench --models echo,digits,resnet18,encoder \
          --clients "$BURN_CLIENTS" --runs "$RUNS" --label "${{ matrix.runner }}" \
          --json results/burn.json | tee results/burn.md
        benches/burn/target/release/furnace-burn-bench overhead echo | tee results/overhead.txt

    - name: LLM server layer (benches/llm)
      shell: bash
      run: |
        benches/llm/target/release/furnace-llm-bench --runs "$RUNS" --json results/llm.json \
          | tee results/llm.md
        benches/llm/target/release/furnace-llm-bench overhead | tee results/llm-overhead.txt

    - name: Nervous system (benches/nerve)
      shell: bash
      run: |
        benches/nerve/target/release/furnace-nerve-bench --runs "$RUNS" --clients "$BURN_CLIENTS" \
          --json results/nerve.json | tee results/nerve.txt

    - name: Cold start (furnace binary, ResNet-18)
      shell: bash
      run: |
        benches/burn/target/release/furnace-burn-bench cold-start binary dist/furnace \
          --model-name resnet18 | tee results/cold-start.txt

    - name: Summary
      shell: bash
      run: bash benches/ci-summary.sh runner results >> "$GITHUB_STEP_SUMMARY"

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: bench-${{ matrix.arch }}
        path: results
        if-no-files-found: ignore

  ratios:
    name: Ratios, all runners
    needs: bench
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Download results
      uses: actions/download-artifact@v5
      with:
        pattern: bench-*

    - name: Summary
      shell: bash
      run: |
        {
          echo "## Ratios on GitHub's runners"
          echo
          echo "Medians of $RUNS runs, furnace ${{ github.sha }}. Shared runners are noisy: the ratios matter, not the absolute numbers. Each runner's job summary has the full tables."
          echo
          bash benches/ci-summary.sh combine bench-x86_64 bench-arm64
        } | tee ratios.md >> "$GITHUB_STEP_SUMMARY"

    - name: Upload ratios
      uses: actions/upload-artifact@v5
      with:
        name: ratios
        path: ratios.md

  readme:
    name: README numbers
    needs: bench
    # Only a manual run that asks for it. The x86_64 results are enough, even when the Arm runner
    # failed
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.update_readme }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Download results
      uses: actions/download-artifact@v5
      with:
        name: bench-x86_64
        path: results

    - name: Rewrite README.md
      shell: bash
      env:
        BENCH_COMMIT: ${{ github.sha }}
        BENCH_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        BENCH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: bash benches/readme-numbers.sh results README.md

    # Needs "Allow GitHub Actions to create and approve pull requests" (Settings → Actions →
    # General). A pull request opened with this token starts no workflows: close and reopen it
    # to run CI
    - name: Open a pull request
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        BASE: ${{ github.ref_name }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        if git diff --quiet README.md; then
          echo "README.md is unchanged"
          exit 0
        fi
        day=$(date -u +%Y-%m-%d)
        branch="bench/readme-$day"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git switch -c "$branch"
        git commit -q -m "docs: README numbers from the benchmarks run of $day" README.md
        # A second run on the same day replaces the first one's branch and its open pull request
        git push --force origin "$branch"
        if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
          gh pr create --base "$BASE" --head "$branch" \
            --title "docs: README numbers from the benchmarks run of $day" \
            --body "README.md's measured numbers from the x86_64 runner of $RUN_URL, rewritten by \`benches/readme-numbers.sh\`. Opened by the workflow, so no CI ran: close and reopen this pull request to run it."
        fi
