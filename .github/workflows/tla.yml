name: TLA+

# Model-check the nervous system's design (specs/README.md): when the specs or the code they
# model change, and on every push to main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
    paths:
      - 'specs/**'
      - 'src/nerve/**'
      - '.github/workflows/tla.yml'
  workflow_dispatch:

# On a pull request a newer push makes an older run redundant; on main every commit runs to the
# end, so the README badge shows a result, never a cancelled run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The TLA+ tools' last stable release, checked against the checksum of the jar downloaded
  # when it was pinned
  TLA_TOOLS_VERSION: v1.7.4
  TLA_TOOLS_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88

jobs:
  tlc:
    name: TLC ${{ matrix.model }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: MCMotor, model: MCMotor }
          - { module: MCMotor, model: MCMotorPreempt }
          - { module: MCLanes, model: MCLanesCross }
          - { module: MCLanes, model: MCLanesCycle }
          - { module: MCLanes, model: MCLanesFull }
          - { module: MCLanes, model: MCLanesOrder }
          - { module: MCRouting, model: MCRouting }
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'

    - name: Download tla2tools.jar
      run: |
        curl -sSfL -o "$RUNNER_TEMP/tla2tools.jar" \
          "https://github.com/tlaplus/tlaplus/releases/download/$TLA_TOOLS_VERSION/tla2tools.jar"
        echo "$TLA_TOOLS_SHA256  $RUNNER_TEMP/tla2tools.jar" | sha256sum --check

    # Liveness is checked once, on the whole state graph; TLC exits non-zero on any violation
    - name: Check ${{ matrix.model }}
      working-directory: specs
      run: |
        java -XX:+UseParallelGC -cp "$RUNNER_TEMP/tla2tools.jar" tlc2.TLC \
          -workers auto -lncheck final -metadir "$RUNNER_TEMP/states" \
          -config "${{ matrix.model }}.cfg" "${{ matrix.module }}"
