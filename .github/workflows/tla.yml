name: TLA+

# Model-check the nervous system's design (specs/README.md): on pull requests that change the
# specs (TLC reads nothing else), and nightly on main when they changed since the last successful
# nightly run. Every pull request runs `TLA+ required`, the job to require before merging.
on:
  pull_request:
    branches: [ main ]
  schedule:
    # Every night, 03:47 UTC
    - cron: '47 3 * * *'
  workflow_dispatch:

# On a pull request a newer push makes an older run redundant; every other run (scheduled, by
# hand) is a group of its own and runs to the end
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The TLA+ tools' last stable release, checked against the checksum of the jar downloaded
  # when it was pinned
  TLA_TOOLS_VERSION: v1.7.4
  TLA_TOOLS_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88

jobs:
  # Which jobs this run needs (.github/relevance)
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    # actions: read, to find the earlier scheduled runs
    permissions:
      contents: read
      actions: read
    outputs:
      relevant: ${{ steps.changes.outputs.relevant }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        fetch-depth: 0
        filter: blob:none

    - name: Files this workflow checks
      id: changes
      env:
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        GH_TOKEN: ${{ github.token }}
      run: bash .github/changed-files.sh tla

  tlc:
    name: TLC ${{ matrix.model }}
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { module: MCMotor, model: MCMotor }
          - { module: MCMotor, model: MCMotorPreempt }
          - { module: MCLanes, model: MCLanesCross }
          - { module: MCLanes, model: MCLanesCycle }
          - { module: MCLanes, model: MCLanesFull }
          - { module: MCLanes, model: MCLanesOrder }
          - { module: MCRouting, model: MCRouting }
    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Install Java
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'

    - name: Download tla2tools.jar
      run: |
        curl -sSfL -o "$RUNNER_TEMP/tla2tools.jar" \
          "https://github.com/tlaplus/tlaplus/releases/download/$TLA_TOOLS_VERSION/tla2tools.jar"
        echo "$TLA_TOOLS_SHA256  $RUNNER_TEMP/tla2tools.jar" | sha256sum --check

    # Liveness is checked once, on the whole state graph; TLC exits non-zero on any violation
    - name: Check ${{ matrix.model }}
      working-directory: specs
      run: |
        java -XX:+UseParallelGC -cp "$RUNNER_TEMP/tla2tools.jar" tlc2.TLC \
          -workers auto -lncheck final -metadir "$RUNNER_TEMP/states" \
          -config "${{ matrix.model }}.cfg" "${{ matrix.module }}"

  # The check to require before merging: every job above passed, or was skipped as not needed
  required:
    name: TLA+ required
    if: always()
    needs: [changes, tlc]
    runs-on: ubuntu-latest
    steps:
    - name: Every job passed or was skipped
      env:
        NEEDS: ${{ toJSON(needs) }}
        RESULTS: ${{ join(needs.*.result, ' ') }}
      run: |
        echo "$NEEDS"
        for result in $RESULTS; do
          case $result in
            success|skipped) ;;
            *) echo "::error::A job ended in $result"; exit 1 ;;
          esac
        done
