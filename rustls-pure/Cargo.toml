[package]
name = "rustls-pure"
# A version of its own, not Furnace's: raised only when rustls-pure changes (DEVELOPMENT.md,
# "Releasing rustls-pure"; CHANGELOG.md)
version = "0.14.1"
edition = "2024"
# Tested weekly (.github/workflows/rustls-pure.yml), as is the newest rustls in the range below
rust-version = "1.89"
authors = ["Furnace Contributors"]
description = "A pure-Rust crypto provider for rustls: TLS 1.3 only, RustCrypto primitives with no C or assembly, checked against Wycheproof and strict about malformed input"
documentation = "https://docs.rs/rustls-pure"
homepage = "https://github.com/Gilfeather/furnace/tree/main/rustls-pure"
repository = "https://github.com/Gilfeather/furnace"
license = "MIT"
keywords = ["rustls", "tls", "crypto", "pure-rust", "rustcrypto"]
categories = ["cryptography", "network-programming"]
readme = "README.md"
# Wycheproof's test vectors (3 MB) and the interoperability script stay in the repository
exclude = ["/wycheproof/", "/interop/"]

[dependencies]
# 0.23.46 or any later 0.23, without its default providers (ring, aws-lc-rs) and without TLS 1.2
rustls = { version = "0.23.46", default-features = false, features = ["std"] }
# `zeroize`: the AEADs wipe their keys (and AES's key schedule) when a connection's keys drop
aes-gcm = { version = "0.11", features = ["zeroize"] }
chacha20poly1305 = { version = "0.11", features = ["zeroize"] }
p256 = { version = "0.14", features = ["ecdh", "ecdsa", "pkcs8"] }
p384 = { version = "0.14", features = ["ecdh", "ecdsa", "pkcs8"] }
ed25519-dalek = { version = "3", features = ["pkcs8"] }
x25519-dalek = { version = "3", features = ["static_secrets"] }
sha2 = "0.11"
hmac = { version = "0.13", features = ["zeroize"] }
getrandom = "0.4"

[dev-dependencies]
# Reads the Wycheproof vectors
serde_json = "1.0"
