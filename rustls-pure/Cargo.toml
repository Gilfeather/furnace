[package]
name = "rustls-pure"
# A version of its own, not Furnace's: raised only when rustls-pure changes (DEVELOPMENT.md,
# "Releasing rustls-pure"; CHANGELOG.md)
version = "0.15.4"
edition = "2024"
# Tested weekly (.github/workflows/rustls-pure.yml), as is the newest rustls in the range below
rust-version = "1.89"
authors = ["Furnace Contributors"]
description = "A pure-Rust crypto provider for rustls: TLS 1.3 only, post-quantum X25519MLKEM768, RustCrypto primitives with no C or assembly, checked against Wycheproof and OpenSSL and strict about malformed input"
documentation = "https://docs.rs/rustls-pure"
homepage = "https://github.com/Gilfeather/furnace/tree/main/rustls-pure"
repository = "https://github.com/Gilfeather/furnace"
license = "MIT"
keywords = ["rustls", "tls", "crypto", "pure-rust", "rustcrypto"]
categories = ["cryptography", "network-programming"]
readme = "README.md"
# Wycheproof's test vectors (5.5 MB), the test certificates, the handshake tests that read them and
# the interoperability and machine-code scripts stay in the repository
exclude = ["/wycheproof/", "/testdata/", "/tests/", "/interop/", "/ct-asm.sh"]

[dependencies]
# 0.23.46 or any later 0.23, without its default providers (ring, aws-lc-rs) and without TLS 1.2
rustls = { version = "0.23.46", default-features = false, features = ["std"] }
# Only the features used: no defaults where they bring in more (OS randomness for nonces, the
# allocating AEAD API, PEM parsing, OIDs, std, P-256 and P-384's precomputed base-point tables,
# which trade memory for time). Every crate below picks CPU instructions (AES-NI and ARMv8 AES,
# CLMUL and PMULL, AVX2, SHA-NI and ARMv8 SHA) at run time on its own, in Rust.
# `zeroize`: the AEADs wipe their keys (and AES's key schedule) when a connection's keys drop
aes-gcm = { version = "0.11", default-features = false, features = ["aes", "zeroize"] }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["zeroize"] }
# `alloc`: the SEC1 public keys and DER signatures handed to rustls
p256 = { version = "0.14", default-features = false, features = ["alloc", "ecdh", "ecdsa", "pkcs8"] }
p384 = { version = "0.14", default-features = false, features = ["alloc", "ecdh", "ecdsa", "pkcs8"] }
ed25519-dalek = { version = "3", features = ["pkcs8"] }
x25519-dalek = { version = "3", features = ["static_secrets"] }
sha2 = { version = "0.11", default-features = false }
hmac = { version = "0.13", features = ["zeroize"] }
getrandom = "0.4"
# X25519MLKEM768; `zeroize`: the decapsulation key is wiped when dropped
ml-kem = { version = "0.3.3", features = ["zeroize"] }

[dev-dependencies]
# Reads the Wycheproof vectors
serde_json = "1.0"
# Random and broken input (src/tests/properties.rs), in place of fuzzing: pure Rust
proptest = { version = "1.12", default-features = false, features = ["std"] }

[lints.rust]
# Kani's proof harnesses (`#[cfg(kani)] mod verification`, set by `cargo kani`)
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
