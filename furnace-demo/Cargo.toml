[package]
name = "furnace-demo"
version = "0.16.0"
edition = "2024"
rust-version = "1.95"
authors = ["Furnace Contributors"]
description = "A one-minute look at furnace's nervous system: reflex or brain at a junction, chosen by deadline and measured latency"
repository = "https://github.com/Gilfeather/furnace"
license = "MIT"
# Installed from the repository (`cargo install --git`) or run as a container image, not from
# crates.io
publish = false

[[bin]]
name = "furnace-demo"
path = "src/main.rs"

[dependencies]
# The brain is the LLM mock engine: no model file to download
furnace = { package = "furnace-server", path = "..", features = ["llm"] }
serde_json = "1.0"
