# cargo-deny configuration file
# https://embarkstudios.github.io/cargo-deny/

[graph]
# CI runs cargo-deny with --all-features, so GPU backend dependencies are checked too
all-features = true

[advisories]
# Vulnerabilities always fail; unmaintained crates only matter for our direct dependencies
unmaintained = "workspace"
yanked = "warn"
ignore = [
    #"RUSTSEC-0000-0000",
]

[licenses]
# Only licenses listed here are accepted; anything else fails the check
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    # Boost license (permissive); xxhash-rust via the GPU backends
    "BSL-1.0",
    # Permissive data license for Mozilla's CA roots (webpki-roots via the GPU backends)
    "CDLA-Permissive-2.0",
    "ISC",
    # Weak (file-level) copyleft; used by Burn via `colored`
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"
# Second copies reached only through Burn (burn, burn-store, burn-onnx, onnx-ir), mostly its
# backends that are never built here (tch, turso_core via cubecl): nothing furnace can change.
# Skipping them leaves the duplicates furnace's own dependencies bring in. A version that leaves
# the lockfile shows up as an unmatched skip; drop it then.
skip = [
    "aead@0.5.2",
    "aes@0.8.4",
    "aes-gcm@0.10.3",
    "allocator-api2@0.4.0",
    "bit-set@0.10.0",
    "bit-vec@0.9.1",
    "block-buffer@0.10.4",
    "cipher@0.4.4",
    "convert_case@0.10.0",
    "convert_case@0.11.0",
    "cpufeatures@0.2.17",
    "crypto-common@0.1.7",
    "ctr@0.9.2",
    "darling@0.21.3",
    "darling@0.24.1",
    "darling_core@0.21.3",
    "darling_core@0.24.1",
    "darling_macro@0.21.3",
    "darling_macro@0.24.1",
    "digest@0.10.7",
    "embedded-hal@0.2.7",
    "embedded-hal@1.0.0",
    "getrandom@0.2.17",
    "ghash@0.5.1",
    "hashbrown@0.13.2",
    "hi_sparse_bitset@0.10.0",
    "hi_sparse_bitset@0.9.0",
    "inout@0.1.4",
    "itertools@0.12.1",
    "itertools@0.15.0",
    "libloading@0.8.9",
    "libloading@0.9.0",
    "linux-raw-sys@0.4.15",
    "nom@8.0.0",
    "polyval@0.6.2",
    "prettyplease@0.1.25",
    "prettyplease@0.3.0",
    "rand@0.8.8",
    "rand_chacha@0.3.1",
    "rand_core@0.6.4",
    "rustc-hash@1.1.0",
    "rustc-hash@2.1.3",
    "rustix@0.38.44",
    "sha2@0.10.9",
    "shlex@1.3.0",
    "strum@0.26.3",
    "strum@0.28.0",
    "strum_macros@0.26.4",
    "strum_macros@0.28.0",
    "syn@1.0.109",
    "unicode-width@0.2.2",
    "universal-hash@0.5.1",
    "windows-sys@0.52.0",
    "windows-sys@0.59.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# candle for furnace-candle, until a candle release without Oniguruma (C) is on crates.io:
# main plus huggingface/candle#4041 (zip 9), from its author's fork until it is merged
allow-git = ["https://github.com/Goldziher/candle"]
