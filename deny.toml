# cargo-deny configuration file
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

[advisories]
# Vulnerabilities always fail; unmaintained crates only matter for our direct dependencies
unmaintained = "workspace"
yanked = "warn"
ignore = [
    #"RUSTSEC-0000-0000",
]

[licenses]
# Only licenses listed here are accepted; anything else fails the check
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    # Weak (file-level) copyleft; used by Burn via `colored`
    "MPL-2.0",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
