[package]
name = "amate"
version = "0.16.0"
edition = "2024"
rust-version = "1.95"
authors = ["Furnace Contributors"]
description = "Dynamic batching on worker threads, with no dependencies: items run alone while a worker is idle and are merged into batches once every worker is busy"
documentation = "https://docs.rs/amate"
repository = "https://github.com/Gilfeather/furnace"
license = "MIT"
keywords = ["batching", "inference", "queue", "threads"]
categories = ["concurrency"]
readme = "README.md"

[dependencies]

[dev-dependencies]
# Property tests only; the crate itself has no dependencies
proptest = { version = "1.12", default-features = false, features = ["std"] }

# Model checking with `RUSTFLAGS="--cfg loom"` (src/model_check.rs): every interleaving of the
# workers and the submitters. Not part of a normal build.
[target.'cfg(loom)'.dev-dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(loom)"] }
