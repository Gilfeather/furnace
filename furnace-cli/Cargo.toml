[package]
name = "furnace-cli"
version = "0.16.1"
edition = "2024"
rust-version = "1.95"
authors = ["Furnace Contributors"]
description = "The furnace command: serve ONNX models compiled to Burn over the KServe / Triton Open Inference Protocol, in pure Rust"
documentation = "https://github.com/Gilfeather/furnace#readme"
repository = "https://github.com/Gilfeather/furnace"
license = "MIT"
keywords = ["machine-learning", "inference", "onnx", "server", "burn"]
categories = ["command-line-utilities", "web-programming::http-server", "science"]
readme = "../README.md"

# `cargo binstall furnace-cli` downloads the release binary instead of compiling
[package.metadata.binstall]
pkg-fmt = "bin"
bin-dir = "furnace{ binary-ext }"

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/furnace-linux-x86_64"

[package.metadata.binstall.overrides.x86_64-unknown-linux-musl]
pkg-url = "{ repo }/releases/download/v{ version }/furnace-linux-x86_64-musl"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/furnace-linux-aarch64"

[package.metadata.binstall.overrides.x86_64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/furnace-macos-x86_64"

[package.metadata.binstall.overrides.aarch64-apple-darwin]
pkg-url = "{ repo }/releases/download/v{ version }/furnace-macos-aarch64"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-url = "{ repo }/releases/download/v{ version }/furnace-windows-x86_64.exe"

[[bin]]
name = "furnace"
path = "src/main.rs"

[features]
default = ["onnx"]
# Serve the ONNX files in furnace-burn/models/ (or $FURNACE_MODELS_DIR), compiled in at build time
onnx = ["furnace-burn/onnx"]
# Compile the built-in models' weights into the binary (single-file deploys)
embed-weights = ["furnace-burn/embed-weights"]
image = ["furnace/image"]
grpc = ["furnace/grpc"]
tls = ["furnace/tls"]
wgpu = ["furnace-burn/wgpu"]
metal = ["furnace-burn/metal"]
cuda = ["furnace-burn/cuda"]

[dependencies]
furnace = { package = "furnace-server", path = "..", version = "0.16.1", default-features = false }
furnace-burn = { path = "../furnace-burn", version = "0.16.1" }
burn = { version = "0.22", default-features = false, features = ["std"] }
clap = { version = "4.5", features = ["derive"] }
kamui = { path = "../kamui", version = "0.16.1" }
# `#[tokio::main]` and `spawn_blocking`; the server enables the rest it needs itself
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
# Log lines with RFC 3339 timestamps, in UTC (JSON) or the local time zone
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "chrono"] }
# The process's session ID in the logs
uuid = { version = "1.0", features = ["v4"] }
# `--config furnace.toml`
toml = "1"
serde = { version = "1.0", features = ["derive"] }
# `--threads`: the default is one thread per physical core, which the standard library does not
# report (`available_parallelism` counts logical CPUs)
num_cpus = "1"
rayon = "1"

[dev-dependencies]
axum = "0.8"
# Encodes the images the image-input tests send (feature `image`)
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde_json = "1.0"
# The tests only call http://127.0.0.1: no TLS stack (its default pulls in aws-lc-sys, C)
reqwest = { version = "0.13", default-features = false, features = ["json"] }
