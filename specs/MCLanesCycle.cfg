\* Two motor neurons commanding each other in a cycle, no deadlines
CONSTANTS
    Outside = Outside
    Nerves = {"A", "B"}
    NerveOf <- CycleNerves
    Script <- CycleScript
    Motors = {"m1", "m2"}
    Limit <- OneEach
    Capacity = 1
    Commanded = {"m1", "m2"}
    BrainDeadlines = {2}
    MaxBrain = 2
    MaxTime = 1
    MaxHops = 4
    MaxCmds = 8

SPECIFICATION Spec

INVARIANTS
    TypeOK
    Bounded
    CountIsTrue
    NoIdlePlace
    ProgramsNeverWait
    LatestWins
    HeardIsTrue

PROPERTIES
    OneOutcome
    UrgentFirst
    LeastUrgentDropped
    EveryCommandEnds
    PlacesComeBack
    ReportGoesUp
    DropReachesBrain

CHECK_DEADLOCK FALSE
