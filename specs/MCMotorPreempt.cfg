\* Two brain commands to dress: the second preempts the first (stop and retries are in MCMotor.cfg)
CONSTANTS
    Motors = {"dress", "arm"}
    Effectors = {"sleeve", "hand"}
    Script <- Short
    Actions = {"dress", "sleeve"}
    Commanded = {"dress"}
    Queued <- DressToArm
    MaxBrain = 2
    MaxStops = 0
    MaxAttempts = 1
    MaxTime = 1
    Deadlines = {1}
    MaxCmds = 6

SPECIFICATION Spec

INVARIANTS
    TypeOK
    HeardIsTrue
    NoWorkAfterCommanderOrDeadline
    NoActForNobody
    OneProgram
    TogetherStopsTheRest
    ActionsOnly

PROPERTIES
    OneOutcome
    EveryCommandEnds
    OutcomeGoesBack
    ReportGoesUp

CHECK_DEADLOCK FALSE
