    Nerves = {"A"}
    NerveOf <- OrderNerves
    Script <- NoScript
    Motors = {}
    Limit <- OneEach
    Capacity = 2
    Commanded = {"finger"}
    BrainDeadlines = {1, 2, 3}
    MaxBrain = 4
    MaxTime = 2
    MaxHops = 4
    MaxCmds = 4

SPECIFICATION Spec

INVARIANTS
    TypeOK
    Bounded
    CountIsTrue
    NoIdlePlace
    ProgramsNeverWait
    LatestWins
    HeardIsTrue

PROPERTIES
    OneOutcome
    UrgentFirst
    LeastUrgentDropped
    EveryCommandEnds
    PlacesComeBack
    ReportGoesUp
    DropReachesBrain

CHECK_DEADLOCK FALSE
