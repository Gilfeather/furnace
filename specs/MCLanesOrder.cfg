\* Commands of different urgency for one nerve: the most urgent first, the least urgent dropped
CONSTANTS
    Outside = Outside
    Nerves = {"A"}
    NerveOf <- OrderNerves
    Script <- OrderScript
    Motors = {"hand"}
    Limit <- OneEach
    Capacity = 2
    Commanded = {"finger"}
    BrainDeadlines = {1, 2, 3}
    MaxBrain = 4
    MaxTime = 2
    MaxCmds = 4

SPECIFICATION Spec

INVARIANTS
    TypeOK
    Bounded
    CountIsTrue
    NoIdlePlace
    InsideNeverWaits
    WaitingHoldsNoPlace

PROPERTIES
    UrgentFirst
    LeastUrgentDropped
    EveryCommandEnds
    PlacesComeBack

CHECK_DEADLOCK FALSE
