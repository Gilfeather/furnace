\* One brain command down the whole tree: outcomes, stop, deadlines, together
CONSTANTS
    Motors = {"dress", "arm"}
    Effectors = {"sleeve", "hand"}
    Script <- Tree
    Actions = {"dress", "sleeve"}
    Commanded = {"dress", "hand"}
    Queued <- DressToArm
    MaxBrain = 1
    MaxStops = 1
    MaxAttempts = 2
    MaxTime = 1
    Deadlines = {1}
    MaxCmds = 5

SPECIFICATION Spec

INVARIANTS
    TypeOK
    HeardIsTrue
    NoWorkAfterCommanderOrDeadline
    NoActForNobody
    OneProgram
    TogetherStopsTheRest
    ActionsOnly

PROPERTIES
    OneOutcome
    EveryCommandEnds
    OutcomeGoesBack
    ReportGoesUp

CHECK_DEADLOCK FALSE
