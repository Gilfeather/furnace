\* Commands to a part whose lane is full, no deadlines: preemption at once, a dropped act's failure goes up
CONSTANTS
    Outside = Outside
    Nerves = {"A"}
    NerveOf <- FullNerves
    Script <- FullScript
    Motors = {"hand"}
    Limit <- OneEach
    Capacity = 1
    Commanded = {"hand", "finger"}
    BrainDeadlines = {2}
    MaxBrain = 4
    MaxTime = 1
    MaxHops = 4
    MaxCmds = 8

SPECIFICATION Spec

INVARIANTS
    TypeOK
    Bounded
    CountIsTrue
    NoIdlePlace
    ProgramsNeverWait
    LatestWins
    HeardIsTrue

PROPERTIES
    OneOutcome
    UrgentFirst
    LeastUrgentDropped
    EveryCommandEnds
    PlacesComeBack
    ReportGoesUp
    DropReachesBrain

CHECK_DEADLOCK FALSE
