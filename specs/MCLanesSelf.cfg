\* A part commanding into itself, directly and through a part outside every nerve, without a deadline: it never waits for itself
CONSTANTS
    Outside = Outside
    Nerves = {"A"}
    NerveOf <- SelfNerves
    Script <- SelfScript
    Motors = {"hand", "spine"}
    Limit <- OneEach
    Capacity = 1
    Commanded = {"hand"}
    BrainDeadlines = {2}
    MaxBrain = 2
    MaxTime = 1
    MaxCmds = 8

SPECIFICATION Spec

INVARIANTS
    TypeOK
    Bounded
    CountIsTrue
    NoIdlePlace
    InsideNeverWaits
    WaitingHoldsNoPlace

PROPERTIES
    UrgentFirst
    LeastUrgentDropped
    EveryCommandEnds
    PlacesComeBack

CHECK_DEADLOCK FALSE
