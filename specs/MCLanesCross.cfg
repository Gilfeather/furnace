\* Each part commands into the other nerve, with deadlines: they wait for each other until a deadline passes
CONSTANTS
    Outside = Outside
    Nerves = {"A", "B"}
    NerveOf <- CrossNerves
    Script <- CrossScript
    Motors = {"hand", "leg"}
    Limit <- OneEach
    Capacity = 1
    Commanded = {"hand", "leg"}
    BrainDeadlines = {1}
    MaxBrain = 2
    MaxTime = 1
    MaxCmds = 4

SPECIFICATION Spec

INVARIANTS
    TypeOK
    Bounded
    CountIsTrue
    NoIdlePlace
    InsideNeverWaits
    WaitingHoldsNoPlace

PROPERTIES
    UrgentFirst
    LeastUrgentDropped
    EveryCommandEnds
    PlacesComeBack

CHECK_DEADLOCK FALSE
