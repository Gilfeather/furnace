\* Two parts commanding each other's acts, both lanes flooded, no deadlines
CONSTANTS
    Outside = Outside
    Nerves = {"A", "B"}
    NerveOf <- CrossNerves
    Script <- CrossScript
    Motors = {"hand", "leg"}
    Limit <- OneEach
    Capacity = 1
    Commanded = {"hand", "leg", "toe", "finger"}
    BrainDeadlines = {2}
    MaxBrain = 3
    MaxTime = 1
    MaxHops = 4
    MaxCmds = 6

SPECIFICATION Spec

INVARIANTS
    TypeOK
    Bounded
    CountIsTrue
    NoIdlePlace
    ProgramsNeverWait
    LatestWins
    HeardIsTrue

PROPERTIES
    OneOutcome
    UrgentFirst
    LeastUrgentDropped
    EveryCommandEnds
    PlacesComeBack
    ReportGoesUp
    DropReachesBrain

CHECK_DEADLOCK FALSE
