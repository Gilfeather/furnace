# Engine comparison harness. Deliberately its own workspace (own Cargo.lock and target/)
# so `ort` and `tract` never enter furnace's dependency graph.
[package]
name = "furnace-compare"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
default-run = "compare"
description = "Compare furnace against tract and ONNX Runtime on ResNet-18"
license = "MIT"

[workspace]

[[bin]]
name = "compare"
path = "src/main.rs"

[features]
default = []
# Also benchmark furnace on its wgpu backend (Vulkan / DX12 / Metal)
wgpu = ["furnace-burn/wgpu"]

[dependencies]
furnace = { package = "furnace-server", path = "../.." }
# The built-in ResNet-18, from furnace-burn/models/resnet18.onnx
furnace-burn = { path = "../../furnace-burn", features = ["onnx"] }
furnace-bench-common = { path = "../common" }
# No `transformers` feature: ResNet-18 does not need it and it doubles the binary
tract-onnx = { version = "0.23.8", default-features = false }
ort = "=2.0.0-rc.14"
# Only to switch on tract's multithreaded matrix products for the `--threads N` run
tract-linalg = { version = "0.23.8", features = ["multithread-mm"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] }
ureq = { version = "3.4", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Same settings as furnace's release profile (Cargo.toml) and the other harnesses'
# (benches/burn, llm, nerve), so binary sizes and speed are comparable: keep the five identical
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false

# Same patched CPU backend as furnace itself (see furnace-burn/vendor/README.md)
[patch.crates-io]
burn-flex = { path = "../../furnace-burn/vendor/burn-flex" }
